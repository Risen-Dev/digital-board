# Lint, type-check, self-checks against a real Postgres, and a production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck
      - working-directory: apps/web
        run: node --experimental-strip-types lib/board.check.ts
      - working-directory: apps/web
        run: node --experimental-strip-types lib/chat.check.ts
      - working-directory: apps/web
        run: node --experimental-strip-types lib/secret.check.ts
      - working-directory: apps/web
        run: node --experimental-strip-types lib/safe-url.check.ts
      - working-directory: apps/web
        run: node --experimental-strip-types lib/automations.check.ts
      - working-directory: apps/web
        run: node --experimental-strip-types lib/canvas/merge.check.ts
      - working-directory: apps/web
        run: node --experimental-strip-types lib/i18n/i18n.check.ts
      - working-directory: apps/web
        run: node lib/postgres.check.mjs
      - run: npx turbo run build
