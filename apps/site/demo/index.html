<style>
  /* Tokens and column palette from app/globals.css and lib/board.ts.
     data-theme = light/dark (like the app's .dark), data-palette = the Appearance palette. */
  :root {
    --bg: oklch(1 0 0); --fg: oklch(0.141 0.005 285.823); --card: oklch(1 0 0);
    --primary: oklch(0.21 0.006 285.885); --primary-fg: oklch(0.985 0 0);
    --secondary: oklch(0.967 0.001 286.375); --muted: oklch(0.552 0.016 285.938);
    --border: oklch(0.92 0.004 286.32); --lane: color-mix(in oklch, var(--secondary) 45%, var(--bg));
    --c0: #6366f1; --c1: #10b981; --c2: #f59e0b; --c3: #ec4899; --c4: #06b6d4; --c5: #8b5cf6; --c6: #ef4444;
    --radius: 0.5rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.141 0.005 285.823); --fg: oklch(0.985 0 0); --card: oklch(0.179 0.006 285.885);
      --primary: oklch(0.985 0 0); --primary-fg: oklch(0.21 0.006 285.885);
      --secondary: oklch(0.214 0.007 285.885); --muted: oklch(0.652 0.013 285.938);
      --border: oklch(0.274 0.006 286.033);
      --c1: #10a37f; --c2: #c2860a; --c4: #0e9bb8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.141 0.005 285.823); --fg: oklch(0.985 0 0); --card: oklch(0.179 0.006 285.885);
    --primary: oklch(0.985 0 0); --primary-fg: oklch(0.21 0.006 285.885);
    --secondary: oklch(0.214 0.007 285.885); --muted: oklch(0.652 0.013 285.938);
    --border: oklch(0.274 0.006 286.033);
    --c1: #10a37f; --c2: #c2860a; --c4: #0e9bb8;
    color-scheme: dark;
  }
  /* Palettes (lib/palettes.ts). Light first, then dark under .is-dark (set by the script). */
  [data-palette="graphite"] { --bg: oklch(1 0 0); --fg: oklch(0.141 0.005 285.823); --card: oklch(1 0 0); --primary: oklch(0.21 0.006 285.885); --primary-fg: oklch(0.985 0 0); --secondary: oklch(0.967 0.001 286.375); --muted: oklch(0.552 0.016 285.938); --border: oklch(0.92 0.004 286.32); --radius: 0.5rem; --c0: #6366f1; --c1: #10b981; --c2: #f59e0b; --c3: #ec4899; --c4: #06b6d4; }
  .is-dark [data-palette="graphite"] { --bg: oklch(0.141 0.005 285.823); --fg: oklch(0.985 0 0); --card: oklch(0.179 0.006 285.885); --primary: oklch(0.985 0 0); --primary-fg: oklch(0.21 0.006 285.885); --secondary: oklch(0.214 0.007 285.885); --muted: oklch(0.652 0.013 285.938); --border: oklch(0.274 0.006 286.033); --c1: #10a37f; --c2: #c2860a; --c4: #0e9bb8; }
  [data-palette="harbor"] { --bg: #f1f4f8; --fg: #172b4d; --card: #ffffff; --primary: #0c66e4; --primary-fg: #ffffff; --secondary: #e4eaf2; --muted: #55637a; --border: #d3dbe6; --radius: 0.375rem; }
  [data-palette="iris"] { --bg: #f7f6fb; --fg: #1f1d2b; --card: #ffffff; --primary: #6a55e8; --primary-fg: #ffffff; --secondary: #eeebfa; --muted: #63607a; --border: #e3e0f0; --radius: 0.75rem; }
  [data-palette="shanshui"] { --bg: #ece2cb; --fg: #231c12; --card: #f6efdd; --primary: #1f5c9e; --primary-fg: #f6efdd; --secondary: #e2d5b6; --muted: #66563e; --border: #d2c199; --radius: 0.25rem; --c0: #1f5c9e; --c1: #2f8a6c; --c2: #b07d22; --c3: #a8392a; --c4: #2a8794; }
  [data-palette="kanagawa"] { --bg: #f1eadb; --fg: #1a1f2b; --card: #faf6ec; --primary: #1d3f73; --primary-fg: #faf6ec; --secondary: #e6dcc7; --muted: #5a5e6c; --border: #d6cbb3; --radius: 0.125rem; --c0: #1d3f73; --c1: #4d7c8a; --c2: #c49a4a; --c3: #b5462e; --c4: #c98a7c; }
  .is-dark[data-palette="harbor"], .is-dark [data-palette="harbor"] { --bg: #0f1722; --fg: #dee4ea; --card: #18212e; --primary: #579dff; --primary-fg: #0b1a2e; --secondary: #212c3a; --muted: #96a3b5; --border: #2a3646; }
  .is-dark[data-palette="iris"], .is-dark [data-palette="iris"] { --bg: #15141c; --fg: #eceaf5; --card: #1d1c27; --primary: #9b8cff; --primary-fg: #15122b; --secondary: #262434; --muted: #a19eb6; --border: #302e40; }
  .is-dark[data-palette="shanshui"], .is-dark [data-palette="shanshui"] { --bg: #15120d; --fg: #ede3cc; --card: #1f1a13; --primary: #4fa58a; --primary-fg: #10140f; --secondary: #2a2318; --muted: #a8997c; --border: #362d20; --c0: #4f8fd6; --c1: #4fa58a; --c2: #c99a45; --c3: #d0604a; --c4: #4aa9b5; }
  .is-dark[data-palette="kanagawa"], .is-dark [data-palette="kanagawa"] { --bg: #121110; --fg: #ece6d8; --card: #1b1a18; --primary: #7ea6d8; --primary-fg: #0e1a2c; --secondary: #24221f; --muted: #a29d92; --border: #2e2b27; --c0: #7ea6d8; --c1: #6fa3b0; --c2: #d4ab5e; --c3: #e0765c; --c4: #dba293; }
  [data-palette="shanshui"] :is(h1, h2, h3) { font-family: Georgia, "Songti SC", serif; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
         font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  h2, h3 { margin: 0; }
  .banner { background: var(--primary); color: var(--primary-fg); font-size: 13px; text-align: center; padding: 6px 16px; }
  .banner a { font-weight: 600; }
  .banner button { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }
  .app { flex: 1; min-height: 0; display: flex; }
  .side { width: 220px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg); transition: width .2s; overflow: hidden; }
  .side.slim { width: 54px; }
  .side.slim .hide-slim { display: none !important; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; padding: 0 12px; height: 54px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .brand > button:first-child { border: 0; background: none; padding: 0; cursor: pointer; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); display: grid; place-items: center; flex: none; }
  .logo rect { fill: var(--primary-fg); }
  .nav { display: grid; gap: 2px; padding: 12px 8px; }
  .nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 8px; padding: 7px 8px; font-size: 14px; color: var(--muted); cursor: pointer; text-align: left; white-space: nowrap; }
  .nav button:hover { background: var(--secondary); color: var(--fg); }
  .nav button[aria-current="true"] { background: var(--secondary); color: var(--fg); font-weight: 500; }
  .nav .ico { width: 16px; height: 16px; }
  .badge { margin-left: auto; font-size: 10px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; background: var(--secondary); color: var(--muted); padding: 0 5px; border: 1px solid var(--border); }
  .badge.strong { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .side-foot { margin-top: auto; border-top: 1px solid var(--border); }
  .side-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--muted); padding: 10px 16px 6px; }
  .side-project { display: flex; align-items: center; gap: 8px; margin: 0 8px 10px; padding: 5px 8px; border-radius: 8px; background: var(--secondary); font-size: 12px; white-space: nowrap; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
  .side-user small { display: block; color: var(--muted); font-size: 10px; }
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 54px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .ptitle { font-size: 14px; font-weight: 600; margin: 0 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .editable { cursor: text; border-radius: 4px; padding: 1px 4px; margin-left: -4px; }
  .editable:hover { background: var(--secondary); }
  .tabs { display: flex; max-width: 100%; overflow-x: auto; gap: 2px; background: var(--secondary); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .spacer { flex: 1; }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap .ico { position: absolute; left: 9px; color: var(--muted); pointer-events: none; }
  .search { border: 1px solid var(--border); background: var(--secondary); border-radius: 8px; padding: 5px 10px 5px 30px; width: 190px; font-size: 12px; }
  .btn { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-fg); border-radius: 8px; padding: 5px 12px; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; }
  .btn:hover { opacity: .9; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn.ghost:hover { background: var(--secondary); opacity: 1; }
  .btn.ghost.on { border-color: var(--primary); font-weight: 600; }
  .btn.danger { background: transparent; color: #ef4444; border-color: var(--border); }
  .btn.sm { padding: 3px 8px; font-size: 11px; }
  .icon-btn { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; position: relative; }
  .icon-btn:hover { background: var(--secondary); color: var(--fg); }
  .icon-btn .ping { position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: #ef4444; }
  kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 10px; font-family: inherit; color: var(--muted); }
  main { flex: 1; min-height: 0; overflow: auto; position: relative; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  .ico { width: 14px; height: 14px; flex: none; }
  .pill { font-size: 10px; background: var(--primary); color: var(--primary-fg); border-radius: 999px; padding: 0 6px; }

  /* Filter bar */
  .filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--secondary) 50%, transparent); font-size: 12px; }
  .filterbar select, .filterbar input { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
  .filterbar .count-note { margin-left: auto; color: var(--muted); }
  .chip-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; cursor: pointer; }
  .chip-btn.on { border-color: var(--primary); font-weight: 600; }
  .chip-btn .x { border: 0; background: none; padding: 0 4px; cursor: pointer; color: var(--muted); }

  /* Board */
  .board-wrap { padding: 16px 24px; min-height: 100%; width: max-content; min-width: 100%; }
  .board { display: flex; gap: 16px; align-items: flex-start; }
  .swim { margin-bottom: 20px; }
  .swim-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 4px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; position: sticky; left: 0; width: max-content; }
  .lane { flex: 0 0 264px; border-radius: 10px; padding: 2px; }
  .lane.over { outline: 2px dashed var(--muted); outline-offset: 2px; }
  .lane-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; padding: 6px 4px 12px; }
  .lane-head .name { border: 0; background: none; padding: 0 2px; font-weight: 600; cursor: pointer; border-radius: 4px; }
  .lane-head .name:hover { background: var(--secondary); }
  .lane-head .plus { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; border-radius: 4px; }
  .lane-head .plus:hover { background: var(--secondary); color: var(--fg); }
  .limit { font-size: 10px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
  .add-col { flex: 0 0 220px; border: 1px dashed var(--border); border-radius: 10px; background: none; color: var(--muted); padding: 10px; cursor: pointer; font-size: 13px; }
  .add-col:hover { color: var(--fg); background: var(--secondary); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .count { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 5px; font-weight: 500; }
  .cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: transform .15s, box-shadow .15s; cursor: grab; text-align: left; width: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgb(0 0 0 / .08); }
  .cover { display: block; margin: -12px -12px 12px; width: calc(100% + 24px); height: auto; max-height: 140px; object-fit: cover; background: var(--secondary); border-bottom: 1px solid var(--border); }
  .card.dragging { opacity: .4; }
  .card .key { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .card .title { font-weight: 500; margin: 2px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 6px; flex-wrap: wrap; }
  .line > span:not(.avatar) { display: inline-flex; align-items: center; gap: 4px; }
  .blocked { color: #ef4444; font-weight: 500; }
  .late, .over { color: #ef4444; font-weight: 500; }
  .fields-line { font-size: 11px; color: var(--muted); margin-top: 6px; display: grid; }
  .fields-line b { font-weight: 400; color: var(--fg); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c1); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .tag { border-radius: 999px; padding: 1px 8px; background: var(--secondary); color: var(--muted); font-size: 10px; font-weight: 500; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prio { border-radius: 4px; padding: 0 6px; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .02em; }
  .prio-high { color: #ef4444; background: rgba(239,68,68,.1); }
  .prio-medium { color: #f59e0b; background: rgba(245,158,11,.1); }
  .prio-low { color: #6b7280; background: rgba(107,114,128,.12); }
  .due { color: var(--muted); }
  .avatar { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 600; display: inline-grid; place-items: center; flex: none; }
  .avatars { display: flex; }
  .avatars .avatar { box-shadow: 0 0 0 2px var(--card); }
  .avatars .avatar + .avatar { margin-left: -6px; }
  .add { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 10px 4px 0; cursor: pointer; }
  .add:hover { color: var(--fg); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 80; display: flex; align-items: center; gap: 12px; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 8px 10px 8px 14px; font-size: 13px; box-shadow: 0 8px 24px rgb(0 0 0 / .25); }
  .toast button { border: 0; background: var(--bg); color: var(--fg); border-radius: 6px; padding: 3px 10px; font-weight: 600; cursor: pointer; font-size: 12px; }

  /* List */
  .list { padding: 16px; }
  table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 13px; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--lane); cursor: pointer; user-select: none; }
  td:first-child { white-space: normal; min-width: 220px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--secondary); }
  td select { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 4px; font-size: 12px; }
  td select:hover { border-color: var(--border); }
  .table-wrap { overflow-x: auto; }

  /* Calendar */
  .cal { padding: 16px; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cal-head h2 { font-size: 16px; margin: 0 8px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
  .grid > div { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 96px; padding: 4px; min-width: 0; }
  .grid .dow { min-height: 0; font-size: 11px; color: var(--muted); text-align: center; background: var(--lane); }
  .grid .num { font-size: 11px; color: var(--muted); }
  .grid .other { background: var(--lane); }
  .grid .today .num { background: var(--primary); color: var(--primary-fg); border-radius: 999px; padding: 0 6px; }
  .grid .drop { outline: 2px dashed var(--muted); outline-offset: -2px; }
  .chip { display: block; width: 100%; border: 0; text-align: left; font-size: 11px; padding: 2px 6px; margin-top: 3px; border-radius: 4px; cursor: pointer;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Timeline */
  .tl { position: relative; }
  .tl-head { position: sticky; top: 0; z-index: 20; display: flex; height: 44px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .tl-name { position: sticky; left: 0; z-index: 10; flex: none; width: 260px; border-right: 1px solid var(--border); background: var(--bg); }
  .tl-head .tl-name { display: flex; align-items: flex-end; padding: 0 16px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .tl-day { position: relative; flex: none; width: 28px; border-right: 1px solid color-mix(in oklch, var(--border) 50%, transparent); font-size: 10px; color: var(--muted); text-align: center; }
  .tl-day.we { background: color-mix(in oklch, var(--secondary) 60%, transparent); }
  .tl-day .m { position: absolute; left: 4px; top: 4px; white-space: nowrap; font-weight: 600; color: var(--fg); }
  .tl-day .d { position: absolute; inset: auto 0 6px; }
  .tl-day.today .d { color: #ef4444; font-weight: 700; }
  .tl-row { position: relative; display: flex; height: 36px; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); }
  .tl-row .tl-name { display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 12px; border: 0; border-right: 1px solid var(--border); text-align: left; cursor: pointer; color: var(--fg); }
  .tl-row .tl-name:hover { background: var(--secondary); }
  .tl-row .tl-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-bar { position: absolute; top: 6px; height: 24px; z-index: 5; border: 0; border-radius: 6px; padding: 0 8px; color: #fff; font-size: 11px; font-weight: 500; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
  .tl-today { position: absolute; top: 44px; bottom: 0; width: 1px; background: #ef4444; z-index: 6; pointer-events: none; }
  .tl-note { padding: 12px 16px; font-size: 12px; color: var(--muted); position: sticky; left: 0; }

  /* Pages (home, analytics, inbox, my tasks, meetings, settings) */
  .page { padding: 24px; max-width: 1100px; }
  .page.center { margin: 0 auto; max-width: 760px; }
  .page h2 { font-size: 20px; font-weight: 600; }
  .page h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .page .sub { color: var(--muted); font-size: 13px; margin: 2px 0 20px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 14px 16px; }
  .tile small { color: var(--muted); font-size: 12px; }
  .tile b { display: block; font-size: 24px; font-weight: 600; margin-top: 2px; }
  .tile em { font-style: normal; font-size: 11px; color: var(--muted); }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .panel { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 16px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .panel-head h3 { margin: 0; }
  .link-btn { border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0; }
  .link-btn:hover { color: var(--fg); text-decoration: underline; }
  .rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; border: 0; background: none; text-align: left; width: 100%; font-size: 13px; cursor: pointer; color: var(--fg); }
  .row:hover { background: var(--secondary); }
  .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .row.unread { font-weight: 500; }
  .row.unread::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: none; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 32px; align-items: center; gap: 10px; font-size: 12px; margin: 6px 0; }
  .bar-row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter { height: 8px; border-radius: 999px; background: var(--secondary); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 999px; }
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 8px; }
  .spark div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 9px; color: var(--muted); }
  .spark i { display: block; width: 100%; background: var(--c0); border-radius: 4px 4px 0 0; min-height: 2px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px; }
  .seg { display: inline-flex; gap: 2px; background: var(--secondary); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); font-weight: 500; }

  /* Chat */
  .chat { display: flex; height: 100%; }
  .chat-list { width: 240px; flex: none; border-right: 1px solid var(--border); padding: 12px 8px; overflow: auto; }
  .chat-list .side-label { padding: 8px 8px 4px; }
  .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .chat-head { padding: 12px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .chat-feed { flex: 1; overflow: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 10px; font-size: 13px; }
  .msg b { font-size: 13px; }
  .msg time { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .msg p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chat-compose { border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 8px; position: relative; }
  .chat-compose textarea { flex: 1; min-height: 40px; height: 40px; resize: none; }
  .presence { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .presence.online { background: #10b981; } .presence.away { background: #f59e0b; } .presence.offline { background: var(--border); }
  @media (max-width: 640px) { .chat-list { width: 120px; } }

  /* Meetings */
  .meet { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 8px; }
  .meet .when { width: 64px; flex: none; text-align: center; font-size: 11px; color: var(--muted); }
  .meet .when b { display: block; font-size: 18px; color: var(--fg); }
  .meet .grow { flex: 1; min-width: 0; }
  .meet .grow p { margin: 2px 0 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .meet.past { opacity: .6; }
  .state { font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--secondary); color: var(--muted); white-space: nowrap; }
  .state.live { background: rgba(16,185,129,.15); color: #10b981; font-weight: 600; }

  /* Settings */
  .settings { display: flex; height: 100%; }
  .settings-nav { width: 200px; flex: none; border-right: 1px solid var(--border); padding: 16px 8px; display: grid; align-content: start; gap: 2px; }
  .settings-nav button { display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .settings-nav button[aria-current="true"] { background: var(--secondary); color: var(--fg); font-weight: 500; }
  .settings-body { flex: 1; min-width: 0; overflow: auto; }
  .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  .rule { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; margin-bottom: 6px; }
  .rule .grow { flex: 1; }
  .palettes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .pal { border: 2px solid var(--border); border-radius: 12px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; background: var(--bg); color: var(--fg); }
  .pal[aria-pressed="true"] { border-color: var(--primary); }
  .pal .pv { display: flex; gap: 6px; padding: 12px; background: var(--secondary); height: 72px; align-items: flex-start; }
  .pal .pv i { flex: 1; height: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .pal .pv i:first-child { border-top: 4px solid var(--primary); }
  .pal div:last-child { padding: 8px 12px; font-size: 12px; }
  .pal small { display: block; color: var(--muted); font-size: 11px; }
  @media (max-width: 640px) {
    .settings { flex-direction: column; }
    .settings-nav { width: auto; border-right: 0; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; padding: 8px; }
  }

  /* Canvas */
  .canvas { height: 100%; min-height: 480px; position: relative; }
  .canvas .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  /* Canvas tags: a dashed frame with an @name label around each named group. */
  .tag-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .tag-frame { position: absolute; border: 2px dashed var(--c0); border-radius: 8px; background: color-mix(in oklch, var(--c0) 6%, transparent); }
  .tag-frame span { position: absolute; top: -10px; left: 8px; padding: 2px 6px; border-radius: 4px; background: var(--c0); color: #fff; font-size: 10px; font-weight: 500; line-height: 1.2; }
  .tag-btn { position: absolute; top: 64px; right: 16px; z-index: 4; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 12px; cursor: pointer; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
  .tag-btn:hover { background: var(--secondary); }
  .tag-btn svg, .tag-preview svg { width: 13px; height: 13px; }
  .tag-link { border: 0; padding: 0; background: none; font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .key-link { border: 0; padding: 0; background: none; font: inherit; color: var(--c0); font-weight: 600; cursor: pointer; }
  .tag-previews { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-preview { width: 224px; display: flex; flex-direction: column; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: none; color: var(--fg); text-align: left; cursor: pointer; }
  .tag-preview:hover { border-color: var(--muted); }
  .tag-preview .pic { height: 160px; display: grid; place-items: center; padding: 8px; background: var(--secondary); color: var(--muted); font-size: 11px; font-weight: 400; }
  .tag-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tag-preview .name { display: flex; align-items: center; gap: 4px; padding: 5px 8px; border-top: 1px solid var(--border); font-size: 11px; font-weight: 400; }

  /* Dialogs */
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--fg); padding: 0; width: min(1020px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: hidden; }
  dialog.new { width: min(640px, calc(100vw - 32px)); }
  dialog.small { width: min(440px, calc(100vw - 32px)); }
  dialog.small .pad { padding: 18px 20px; display: grid; gap: 12px; max-height: calc(100vh - 120px); overflow: auto; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, textarea { border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
  input[type="checkbox"], input[type="radio"] { padding: 0; }
  textarea { min-height: 90px; resize: vertical; }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 18px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .dlg-head .icon-btn { margin-left: auto; }
  .dlg-body { display: flex; height: min(680px, calc(100vh - 100px)); }
  dialog.new .dlg-body { height: auto; max-height: calc(100vh - 100px); }
  .dlg-main { flex: 1; min-width: 0; overflow: auto; padding: 20px 28px; display: grid; gap: 16px; align-content: start; }
  .title-input { border: 0; background: transparent; font-size: 22px; font-weight: 600; padding: 0; min-height: 1.4em; line-height: 1.3; resize: none; field-sizing: content; }
  .title-input:focus { outline: none; }
  .parent-line { font-size: 12px; color: var(--muted); }
  .props { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .prop { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); position: relative; }
  .prop > span:first-child { width: 76px; flex: none; }
  .prop select, .prop input, .prop summary { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; padding: 4px 8px; font-size: 13px; border-radius: 8px; color: var(--fg); }
  .prop select:hover, .prop input:hover, .prop select:focus, .prop input:focus, .prop summary:hover { background: var(--secondary); outline: none; }
  .prop details { flex: 1; min-width: 0; }
  .prop summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 30px; }
  .prop summary::-webkit-details-marker { display: none; }
  .pick-menu { position: absolute; z-index: 30; left: 86px; right: 0; top: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
  .pick-menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); font-size: 13px; cursor: pointer; }
  .pick-menu label:hover { background: var(--secondary); }
  .section { border-top: 1px solid var(--border); padding-top: 14px; display: grid; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .section > span:first-child { display: flex; align-items: center; gap: 6px; }
  .section textarea, .section input, .section select { font-weight: 400; font-size: 13px; }
  .checks label, .subs label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: var(--fg); }
  .checks input[type="checkbox"], .subs input[type="checkbox"] { width: 14px; height: 14px; }
  .subs label .key-link { font-size: 11px; }
  .subs .done-text { text-decoration: line-through; color: var(--muted); }
  .deps { display: grid; gap: 4px; font-weight: 400; color: var(--fg); font-size: 13px; }
  .deps div { display: flex; align-items: center; gap: 8px; }
  .deps .x { border: 0; background: none; color: var(--muted); cursor: pointer; margin-left: auto; }
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; font-weight: 400; }
  .fields-grid .prop .x { border: 0; background: none; color: var(--muted); cursor: pointer; }
  .inline-form { display: flex; gap: 6px; flex-wrap: wrap; font-weight: 400; }
  .inline-form input, .inline-form select { padding: 4px 8px; font-size: 12px; }
  .timer-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 400; color: var(--fg); font-size: 13px; }
  .imgs { display: flex; flex-wrap: wrap; gap: 8px; }
  .img { position: relative; width: 120px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .img img { display: block; width: 100%; height: 80px; object-fit: cover; }
  .img div { display: flex; justify-content: space-between; padding: 2px 4px; font-size: 10px; font-weight: 400; }
  .img button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 10px; padding: 2px; }
  .img .is-cover { position: absolute; top: 4px; left: 4px; font-size: 9px; background: var(--primary); color: var(--primary-fg); border-radius: 4px; padding: 0 4px; }
  .actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; flex-wrap: wrap; }
  .actions .push { margin-left: auto; }
  .dlg-side { width: 340px; flex: none; border-left: 1px solid var(--border); background: var(--lane); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; }
  .feed { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .event { font-size: 11px; color: var(--muted); padding: 0 2px; }
  .comment { display: flex; gap: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .comment b { font-size: 12px; }
  .comment time { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .comment p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mention { color: var(--c0); font-weight: 600; }
  .agent-mark { width: 22px; height: 22px; border-radius: 50%; background: var(--secondary); color: var(--c0); display: grid; place-items: center; flex: none; }
  .composer { flex: none; position: relative; border-top: 1px solid var(--border); padding: 10px; display: grid; gap: 6px; }
  .composer textarea { min-height: 56px; font-size: 13px; resize: none; }
  .composer .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .mentions { position: absolute; left: 10px; right: 10px; bottom: 100%; margin: 0 0 4px; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); z-index: 40; max-height: 240px; overflow: auto; }
  .mentions li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .mentions li[aria-selected="true"] { background: var(--secondary); }
  .mentions small { margin-left: auto; color: var(--muted); }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches label { display: block; }
  .swatches input { position: absolute; opacity: 0; }
  .swatches span { display: block; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--card); }
  .swatches input:checked + span { border-color: var(--fg); }
  .swatches input:focus-visible + span { outline: 2px solid var(--primary); }
  .check-line { display: flex !important; align-items: center; gap: 8px; color: var(--fg) !important; font-size: 13px !important; }
  .member-picks { display: flex; flex-wrap: wrap; gap: 4px 12px; }

  /* Menus (notifications) and the ⌘K palette */
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 340px; max-width: calc(100vw - 24px); background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); overflow: hidden; }
  .menu-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .menu-body { max-height: 400px; overflow: auto; padding: 6px; }
  .menu-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--muted); padding: 8px 8px 2px; text-transform: uppercase; }
  .menu-foot { border-top: 1px solid var(--border); padding: 8px 12px; text-align: center; }
  #palette { width: min(600px, calc(100vw - 32px)); margin-top: 12vh; }
  #palette input { width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 14px 16px; font-size: 15px; background: transparent; }
  #palette input:focus { outline: none; }
  #palette .results { max-height: 50vh; overflow: auto; padding: 6px; }
  #palette .row[aria-selected="true"] { background: var(--secondary); }

  @media (max-width: 760px) {
    .dlg-body { flex-direction: column; height: calc(100vh - 100px); overflow: auto; }
    .dlg-main { overflow: visible; padding: 16px; }
    .dlg-side { width: auto; border-left: 0; border-top: 1px solid var(--border); }
    .feed { max-height: 320px; }
    .props, .fields-grid { grid-template-columns: 1fr; }
  }
  .sm-only { display: none !important; }
  .scrim { display: none; }
  @media (max-width: 767px) {
    .side { position: fixed; inset: 0 auto 0 0; z-index: 70; transform: translateX(-100%); transition: transform .2s; width: 220px !important; }
    .side.open { transform: none; }
    .side.slim .hide-slim { display: revert !important; }
    .scrim.open { display: block; position: fixed; inset: 0; z-index: 65; background: rgb(0 0 0 / .4); }
    .sm-only { display: inline-flex !important; }
    header { padding: 8px 12px; gap: 6px; }
    .hide-sm { display: none !important; }
    .page { padding: 16px; }
  }
  @media (max-width: 640px) {
    .search-wrap { order: 10; width: 100%; }
    .search { width: 100%; }
    .tabs button .lbl { display: none; }
  }
</style>
</head>
<body>
<div class="banner">Live demo · changes stay in your browser · <button type="button" id="reset" title="Put the sample data back">Reset demo</button> · <a href="../">Back to Digital Board</a></div>
<div class="app">
<div class="scrim" id="scrim"></div>
<aside class="side" id="side-nav">
  <div class="brand">
    <button type="button" id="collapse" aria-label="Collapse sidebar"><span class="logo"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.2"/><rect x="9" y="1" width="6" height="6" rx="1.2" opacity=".6"/><rect x="1" y="9" width="6" height="6" rx="1.2" opacity=".6"/><rect x="9" y="9" width="6" height="6" rx="1.2" opacity=".3"/></svg></span></button>
    <span class="editable hide-slim" id="ws-name" title="Rename workspace"></span>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">
    <div class="side-label hide-slim">PROJECTS</div>
    <div class="side-project hide-slim"><span class="dot" style="background:var(--c0)"></span><span id="side-project"></span></div>
    <div class="side-user"><span class="avatar" style="background:#6366f1">AL</span><div class="hide-slim">Ada Lovelace<small>ada@acme.example</small></div></div>
  </div>
</aside>
<div class="main-col">
<header>
  <button class="icon-btn sm-only" id="menu-btn" aria-label="Open menu"></button>
  <h1 class="ptitle" id="ptitle"></h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="spacer"></span>
  <label class="search-wrap" id="search-wrap"><span id="search-ico"></span><input class="search" id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks"></label>
  <button class="btn ghost" id="filter-btn"></button>
  <button class="icon-btn" id="palette-btn" title="Search (⌘K)" aria-label="Search"></button>
  <button class="icon-btn" id="theme" aria-label="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <div style="position:relative">

const svg = (k, style = "") => `<svg class="ico" style="${style}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

let toastTimer;

const COVER = `<svg class="cover" viewBox="0 0 264 120" aria-hidden="true"><rect width="264" height="120" fill="var(--secondary)"/>

// ── Filters and saved views ───────────────────────────────────────────────
let filters = {};
let showFilters = false;
const subtasksOf = (t) => state.tasks.filter((s) => s.parent === t.id && !s.archived);
function matches(t) {
  const f = filters, q = (f.q || "").toLowerCase();
  if (t.archived) return false;
  if (q && !`${t.key} ${t.title} ${t.desc} ${t.label}`.toLowerCase().includes(q)) return false;
  if (f.who && !t.who.includes(f.who === "me" ? ME : f.who)) return false;
  if (f.prio && t.prio !== f.prio) return false;
  if (f.label && !labelsOf(t.label).includes(f.label)) return false;
  if (f.sprint) {
    const want = f.sprint === "current" ? currentSprint()?.id : f.sprint === "none" ? "" : f.sprint;
    if ((t.sprint || "") !== (want ?? "-")) return false;
  }
  return true;
}
const visible = () => state.tasks.filter(matches);
const activeFilters = () => ["who", "prio", "label", "sprint", "group"].filter((k) => filters[k]).length;

function renderFilterbar() {
  const bar = $("#filterbar");
  bar.hidden = !(showFilters && section === "board");
  $("#filter-btn").innerHTML = `${svg("filter")}<span class="hide-sm">Filter</span>${activeFilters() ? `<span class="pill">${activeFilters()}</span>` : ""}`;
  $("#filter-btn").classList.toggle("on", activeFilters() > 0);
  if (bar.hidden) return;
  const opt = (v, label, cur) => `<option value="${esc(v)}"${cur === v ? " selected" : ""}>${esc(label)}</option>`;
  const sp = currentSprint(), sprint = filters.sprint && state.sprints.find((s) => s.id === (filters.sprint === "current" ? sp?.id : filters.sprint));
  const inSprint = sprint ? state.tasks.filter((t) => !t.archived && t.sprint === sprint.id) : [];
  const all = state.tasks.filter((t) => !t.archived).length;
  bar.innerHTML = `
    ${state.views.map((v, i) => `<span class="chip-btn" data-saved="${i}">${esc(v.name)}<button type="button" class="x" data-unsave="${i}" aria-label="Remove view ${esc(v.name)}">×</button></span>`).join("")}
    <span id="save-view-wrap"><button type="button" class="btn ghost sm" id="save-view">+ Save view</button></span>
    ${view === "board" ? `<select data-f="group" aria-label="Swimlanes">${opt("", "No swimlanes", filters.group || "")}${opt("assignee", "Lanes by assignee", filters.group)}${opt("label", "Lanes by label", filters.group)}${opt("priority", "Lanes by priority", filters.group)}</select>` : ""}
    <select data-f="who">${opt("", "All assignees", filters.who || "")}${opt("me", "Me", filters.who)}${state.members.map((m) => opt(m.id, m.name, filters.who)).join("")}</select>
    <select data-f="prio">${opt("", "All priorities", filters.prio || "")}${["high", "medium", "low"].map((p) => opt(p, cap(p), filters.prio)).join("")}</select>
    <select data-f="label">${opt("", "All labels", filters.label || "")}${allLabels().map((l) => opt(l, l, filters.label)).join("")}</select>
    <button type="button" class="btn ghost sm" id="reset-filters">${svg("x")}Reset</button>
    <select data-f="sprint" aria-label="Sprint">${opt("", "All sprints", filters.sprint || "")}${opt("current", `Current sprint${sp ? ` (${sp.name})` : ""}`, filters.sprint)}${state.sprints.filter((s) => !s.closed).map((s) => opt(s.id, s.name, filters.sprint)).join("")}${opt("none", "Backlog (no sprint)", filters.sprint)}${state.sprints.some((s) => s.closed) ? `<optgroup label="Completed sprints">${state.sprints.filter((s) => s.closed).map((s) => opt(s.id, s.name, filters.sprint)).join("")}</optgroup>` : ""}</select>
    ${sprint ? `<span class="muted">${inSprint.filter(isDone).length}/${inSprint.length} done · ${fmt(sprint.start)} → ${fmt(sprint.end)}</span>` : ""}
    <button type="button" class="btn ghost sm" id="open-sprints">${svg("zap")}Sprints</button>
    <button type="button" class="btn ghost sm" id="open-archived">${svg("archive")}Archived</button>

}
$("#filterbar").addEventListener("change", (e) => {
  const k = e.target.dataset.f;
  if (!k) return;
  filters = { ...filters, [k]: e.target.value || undefined };
  render();
});
$("#filterbar").addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-unsave]")) { state.views.splice(+t.closest("[data-unsave]").dataset.unsave, 1); save(); return render(); }
  const saved = t.closest("[data-saved]");
  if (saved) { const v = state.views[+saved.dataset.saved]; filters = { ...v.filters, q: filters.q }; return setView(v.layout); }
  if (t.closest("#reset-filters")) { filters = { q: filters.q }; return render(); }
  if (t.closest("#open-sprints")) return openSprints();
  if (t.closest("#open-archived")) return openArchived();
  if (t.closest("#save-view")) {
    $("#save-view-wrap").innerHTML = `<input id="view-name" placeholder="View name, Enter to save" maxlength="40" style="width:170px">`;
    $("#view-name").focus();
  }
});
$("#filterbar").addEventListener("keydown", (e) => {
  if (e.target.id !== "view-name") return;
  if (e.key === "Escape") return renderFilterbar();
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const { q, ...rest } = filters;
  state.views.push({ name: e.target.value.trim(), layout: view, filters: rest });
  save(); render();
});
$("#filter-btn").onclick = () => { showFilters = !showFilters; renderFilterbar(); };

// ── Cards ─────────────────────────────────────────────────────────────────
function card(t) {
  const labels = labelsOf(t.label), col = column(t.col), subs = subtasksOf(t);
  const stageDays = Math.floor((Date.now() - t.entered) / DAY);
  const fields = state.fields.filter((f) => t.fields[f.id]);
  const icons = [
    blocked(t) && `<span class="blocked" title="Waiting on another card">${svg("ban")}Blocked</span>`,
    col.limit && `<span class="${stageDays > col.limit ? "over" : ""}" title="${stageDays} day(s) in this column">${svg("timer")}${stageDays}d</span>`,
    (t.time.since || t.time.secs >= 60) && `<span title="${t.time.since ? "Timer running" : "Time logged"}">${t.time.since ? `<i class="live-dot"></i>` : svg("clock")}<span data-timer="${t.id}">${dur(tracked(t))}</span></span>`,
    t.desc && svg("desc"),
    t.checklist.length && `<span>${svg("check")}${t.checklist.filter((i) => i.done).length}/${t.checklist.length}</span>`,
    subs.length && `<span title="Subtasks">${svg("tree")}${subs.filter(isDone).length}/${subs.length}</span>`,
    t.comments.length && `<span>${svg("comment")}${t.comments.length}</span>`,
    t.images.length && `<span>${svg("clip")}${t.images.length}</span>`,
    t.repeat && `<span title="Repeats ${t.repeat}">${svg("repeat")}</span>`,
  ].filter(Boolean);
  const cover = t.images[0] ? `<img class="cover" src="${t.images[0]}" alt="">` : t.cover ? COVER : "";
  return `<button class="card" data-id="${t.id}">${cover}
    <div class="key">${t.key}${t.parent && task(t.parent) ? `<span title="Subtask of ${task(t.parent).key}">↳ ${task(t.parent).key}</span>` : ""}</div><div class="title">${esc(t.title)}</div>
    ${icons.length ? `<div class="line muted">${icons.join("")}</div>` : ""}
    ${t.who.length || t.due ? `<div class="line">${avatars(t.who)}${t.due ? `<span class="due${late(t) ? " late" : ""}">${svg("cal")}${fmt(t.due)}</span>` : ""}</div>` : ""}
    <div class="line"><span>${svg("flag", `color:${PRIO[t.prio]};fill:${PRIO[t.prio]}`)}${cap(t.prio)}</span></div>
    ${labels.length ? `<div class="line">${svg("tag", "color:var(--muted)")}${labels.slice(0, 2).map((l) => `<span class="tag">${esc(l)}</span>`).join("")}${labels.length > 2 ? `<span class="muted" style="font-size:11px" title="${esc(labels.slice(2).join(", "))}">+${labels.length - 2}</span>` : ""}</div>` : ""}
    ${fields.length ? `<div class="fields-line">${fields.map((f) => `<span>${esc(f.name)}: <b>${esc(t.fields[f.id])}</b></span>`).join("")}</div>` : ""}
  </button>`;
}

// ── Board ─────────────────────────────────────────────────────────────────
function columnsHtml(tasks, full) {
  return state.columns.map((c) => {
    const here = tasks.filter((t) => t.col === c.id);
    return `<div class="lane" data-col="${c.id}">
      <div class="lane-head"><span class="dot" style="background:${c.color}"></span>${full ? `<button type="button" class="name" data-edit-col="${c.id}" title="Edit column">${esc(c.title)}</button>` : esc(c.title)}<span class="count">${here.length}</span>${c.limit ? `<span class="limit" title="Day limit">${svg("timer")}${c.limit}d</span>` : ""}<button class="plus" data-add="${c.id}" aria-label="Add task to ${esc(c.title)}">+</button></div>
      <div class="cards">${here.map(card).join("")}</div>
      <button class="add" data-add="${c.id}">+ Add task</button>
    </div>`;
  }).join("");
}
// Swimlanes: a card with two assignees or labels shows in both lanes.
function lanes(tasks) {
  const g = filters.group;
  if (g === "priority") return ["high", "medium", "low"].map((p) => ({ label: `${cap(p)} priority`, tasks: tasks.filter((t) => t.prio === p) }));
  const keys = g === "assignee" ? state.members.map((m) => m.id) : allLabels();
  const of = (t) => g === "assignee" ? t.who : labelsOf(t.label);
  return [...keys.map((k) => ({ label: g === "assignee" ? person(k).name : k, tasks: tasks.filter((t) => of(t).includes(k)) })),
    { label: g === "assignee" ? "Unassigned" : "No label", tasks: tasks.filter((t) => !of(t).length) }].filter((l) => l.tasks.length);
}
function renderBoard() {
  const tasks = visible();
  $("#view-board").innerHTML = filters.group
    ? lanes(tasks).map((l) => `<div class="swim"><div class="swim-head">${esc(l.label)}<span class="count">${l.tasks.length}</span></div><div class="board">${columnsHtml(l.tasks, false)}</div></div>`).join("") || `<p class="empty">No tasks match.</p>`
    : `<div class="board">${columnsHtml(tasks, true)}<button type="button" class="add-col" id="add-col">+ Add column</button></div>`;
}

const board = $("#view-board");
let drag = null; // { card, id, x, y, ghost, armed, timer, moved }
board.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) return drag?.moved ? null : openTask(+card.dataset.id);
  const add = e.target.closest("[data-add]");
  if (add) return openTask(null, add.dataset.add);
  const edit = e.target.closest("[data-edit-col]");
  if (edit) return openColumn(edit.dataset.editCol);
  if (e.target.closest("#add-col")) {
    const c = { id: `c${Date.now()}`, title: "New column", color: COLORS[state.columns.length % COLORS.length], limit: null };
    // New columns go before the last one, which stays the "done" column.
    state.columns.splice(state.columns.length - 1, 0, c);
    save(); render(); openColumn(c.id);
  }
});

// Pointer events instead of HTML5 drag and drop, which phones don't support.
// Mouse drags at once; touch needs a short hold so a swipe still scrolls the board.
board.addEventListener("pointerdown", (e) => {
  const card = e.target.closest(".card");
  if (!card || e.button > 0) return;
  drag = { card, id: +card.dataset.id, x: e.clientX, y: e.clientY, armed: e.pointerType === "mouse", moved: false };
  if (!drag.armed) drag.timer = setTimeout(() => { if (drag) { drag.armed = true; navigator.vibrate?.(10); } }, 250);
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  const far = Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6;
  if (!drag.armed) { if (far) { clearTimeout(drag.timer); drag = null; } return; }
  if (!drag.ghost) {
    if (!far) return;
    const r = drag.card.getBoundingClientRect();
    drag.ghost = drag.card.cloneNode(true);
    Object.assign(drag.ghost.style, { position: "fixed", left: 0, top: 0, width: `${r.width}px`, pointerEvents: "none",
      zIndex: 50, rotate: "2deg", boxShadow: "0 12px 32px rgb(0 0 0 / .25)" });
    drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
    document.body.append(drag.ghost);
    drag.card.classList.add("dragging");
    drag.moved = true;
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px)`;
  const lane = document.elementFromPoint(e.clientX, e.clientY)?.closest(".lane");
  board.querySelectorAll(".over").forEach((l) => l !== lane && l.classList.remove("over"));
  lane?.classList.add("over");
});
// While a touch drag is armed, stop the browser from scrolling instead.
addEventListener("touchmove", (e) => { if (drag?.armed) e.preventDefault(); }, { passive: false });
addEventListener("pointerup", (e) => {
  if (!drag) return;
  clearTimeout(drag.timer);
  const { id, ghost } = drag;
  if (!ghost) return void (drag = null);
  ghost.remove();
  const lane = document.elementFromPoint(e.clientX, e.clientY)?.closest(".lane");
  if (lane) {
    // Drop before the first card whose middle is below the pointer.
    const before = [...lane.querySelectorAll(".card:not(.dragging)")]
      .find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
    moveTask(id, lane.dataset.col, before ? +before.dataset.id : null);
  }
  render();
  setTimeout(() => (drag = null)); // after the click that follows pointerup
});
addEventListener("pointercancel", () => { if (drag) { clearTimeout(drag.timer); drag.ghost?.remove(); drag = null; renderBoard(); } });

function moveTask(id, col, beforeId) {
  const t = task(id);
  const from = t.col;
  state.tasks.splice(state.tasks.indexOf(t), 1);
  const at = beforeId ? state.tasks.findIndex((x) => x.id === beforeId) : state.tasks.length;
  state.tasks.splice(at, 0, t);
  if (from !== col) changeColumn(t, col);
  save();
}
// Every column change goes through here: history, stage timer, automations, repeats.
function changeColumn(t, col) {
  const from = t.col;
  t.col = col;
  t.entered = Date.now();
  log(t, `moved from ${column(from).title} to ${column(col).title}`);
  runAutomations(t, "moved");
  if (col === doneId() && t.repeat) repeatTask(t);
}

// The next copy of a repeating card, due one interval later, back in the first column.
function repeatTask(t) {
  const base = t.due || day(0);
  const d = new Date(base + "T00:00");
  if (t.repeat === "daily") d.setDate(d.getDate() + 1);
  else if (t.repeat === "weekly") d.setDate(d.getDate() + 7);
  else { const dd = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(dd, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  const copy = createTask({ ...structuredClone(t), col: state.columns[0].id, due: iso(d), start: "", comments: [], images: [],
    checklist: t.checklist.map((i) => ({ ...i, done: false })), time: { secs: 0, since: null } });
  log(t, `repeats: created ${copy.key}`);
}

function createTask(v) {
  const id = ++state.seq;
  const t = { desc: "", prio: "medium", label: "", who: [], start: "", due: "", checklist: [], comments: [], parent: null, blockedBy: [],
    sprint: "", repeat: "", fields: {}, images: [], archived: false, time: { secs: 0, since: null }, ...v,
    id, key: `WEB-${id}`, entered: Date.now(), history: [] };
  delete t.cover;
  log(t, "created this card");
  state.tasks.push(t);
  runAutomations(t, "created");
  return t;
}

// ── Automations (Settings → Projects): one action per rule ────────────────
const ACTIONS = { assign: "assign", unassign: "unassign everyone", priority: "set priority", label: "add label", due: "set due in N days" };
function ruleText(r) {
  const when = r.when === "created" ? "a card is created" : `a card moves to ${r.col ? column(r.col).title : "any column"}`;
  const what = r.action === "assign" ? `assign ${person(r.value)?.name ?? "?"}` : r.action === "unassign" ? "unassign everyone"
    : r.action === "priority" ? `set priority to ${cap(r.value || "medium")}` : r.action === "label" ? `add label “${r.value}”` : `set the due date ${r.value} day(s) out`;
  return `When ${when}, ${what}`;
}
function runAutomations(t, when) {
  for (const r of state.automations) {
    if (r.when !== when || (r.when === "moved" && r.col && r.col !== t.col)) continue;
    if (r.action === "assign" && person(r.value) && !t.who.includes(r.value)) t.who = [...t.who, r.value];
    else if (r.action === "unassign") t.who = [];
    else if (r.action === "priority") t.prio = r.value;
    else if (r.action === "label" && !labelsOf(t.label).includes(r.value)) t.label = [...labelsOf(t.label), r.value].join(", ");
    else if (r.action === "due") t.due = day(+r.value || 0);
    else continue;
    log(t, `Automation: ${ruleText(r).replace(/^When [^,]+, /, "")}`, "automation");
  }
}

// ── Column editor ─────────────────────────────────────────────────────────
function openColumn(id) {
  const c = column(id), i = state.columns.indexOf(c), empty = !state.tasks.some((t) => t.col === id && !t.archived);
  smallDialog("Edit column", `
    <label>Name <input name="title" value="${esc(c.title)}" maxlength="40" required></label>
    <div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Colour</div><div class="swatches">${COLORS.map((col) =>
      `<label><input type="radio" name="color" value="${col}"${col === c.color ? " checked" : ""}><span style="background:${col}"></span></label>`).join("")}</div></div>
    <label>Day limit <input name="limit" type="number" min="1" max="365" value="${c.limit ?? ""}" placeholder="No limit"><small>Cards in this column longer than this turn red.</small></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn ghost sm" data-move="-1"${i === 0 ? " disabled" : ""}>← Move left</button>
      <button type="button" class="btn ghost sm" data-move="1"${i === state.columns.length - 1 ? " disabled" : ""}>Move right →</button>
      <button type="button" class="btn danger sm" data-del-col style="margin-left:auto"${empty && state.columns.length > 1 ? "" : ` disabled title="Move its cards out first"`}>Delete</button>
    </div>
    <div style="display:flex;gap:8px"><button class="btn">Save</button><button type="button" class="btn ghost" data-close-small>Cancel</button></div>`,
  (v) => { c.title = v.title.trim() || c.title; c.color = v.color; c.limit = v.limit ? +v.limit : null; save(); render(); },
  (e) => {
    const move = e.target.closest("[data-move]");
    if (move) {
      const j = i + +move.dataset.move;
      [state.columns[i], state.columns[j]] = [state.columns[j], state.columns[i]];
      save(); render(); openColumn(id);
    }
    if (e.target.closest("[data-del-col]")) { state.columns.splice(i, 1); save(); $("#small").close(); render(); }
  });
}

// One small modal for column, sprint, archive, member and meeting forms.
let smallSubmit = null, smallClick = null;
function smallDialog(title, html, onSubmit, onClick) {
  $("#small-title").textContent = title;
  $("#small-body").innerHTML = html;
  smallSubmit = onSubmit; smallClick = onClick;
  if (!$("#small").open) $("#small").showModal();
}
$("#small-body").addEventListener("submit", (e) => {
  const fd = new FormData(e.target);
  const v = Object.fromEntries(fd);
  v._all = (k) => fd.getAll(k);
  if (smallSubmit?.(v) === false) e.preventDefault();
});
$("#small").addEventListener("click", (e) => {
  if (e.target.closest("[data-close-small]")) return $("#small").close();
  smallClick?.(e);
});

// ── Sprints and archive ───────────────────────────────────────────────────
function openSprints() {
  const rows = state.sprints.map((s) => {
    const tasks = state.tasks.filter((t) => !t.archived && t.sprint === s.id);
    return `<div class="rule"><div class="grow"><b>${esc(s.name)}</b>${s === currentSprint() ? ` <span class="state live">Current</span>` : s.closed ? ` <span class="state">Completed</span>` : ""}<br><small class="muted">${fmt(s.start)} → ${fmt(s.end)} · ${tasks.filter(isDone).length}/${tasks.length} done</small></div>
      ${s.closed ? "" : `<button type="button" class="btn ghost sm" data-close-sprint="${s.id}">Complete</button>`}</div>`;
  }).join("");
  smallDialog("Sprints", `${rows}
    <div class="form-row"><label style="flex:1">Name <input name="name" required maxlength="40" value="Sprint ${state.sprints.length + 1}"></label></div>
    <div class="form-row"><label>Start <input name="start" type="date" required value="${day(0)}"></label><label>End <input name="end" type="date" required value="${day(13)}"></label></div>
    <div><button class="btn">Create sprint</button></div>`,
  (v) => {
    if (v.end < v.start) { toast("The end date is before the start."); return false; }
    state.sprints.push({ id: `s${Date.now()}`, name: v.name.trim(), start: v.start, end: v.end, closed: false });
    save(); render(); setTimeout(openSprints);
  },
  (e) => {
    const b = e.target.closest("[data-close-sprint]");
    if (!b) return;
    // Completing a sprint sends its unfinished cards back to the backlog.
    const s = state.sprints.find((x) => x.id === b.dataset.closeSprint);
    s.closed = true;
    for (const t of state.tasks) if (t.sprint === s.id && !isDone(t)) t.sprint = "";
    save(); render(); openSprints();
  });
}
function openArchived() {
  const rows = state.tasks.filter((t) => t.archived);
  smallDialog("Archived", rows.length ? rows.map((t) => `<div class="rule"><span class="muted">${t.key}</span><span class="grow">${esc(t.title)}</span>
    <button type="button" class="btn ghost sm" data-restore="${t.id}">Restore</button><button type="button" class="btn danger sm" data-purge="${t.id}">Delete</button></div>`).join("")
    : `<p class="empty">Nothing is archived. Archive a card from its dialog.</p>`, null, (e) => {
    const r = e.target.closest("[data-restore]"), p = e.target.closest("[data-purge]");
    if (r) { const t = task(+r.dataset.restore); t.archived = false; log(t, "restored this card"); }
    else if (p) deleteTask(task(+p.dataset.purge));
    else return;
    save(); render(); openArchived();
  });
}

// ── List ──────────────────────────────────────────────────────────────────
let sort = { by: "col", dir: 1 };
const RANK = { col: (t) => state.columns.findIndex((c) => c.id === t.col), prio: (t) => ["high", "medium", "low"].indexOf(t.prio),
  title: (t) => t.title.toLowerCase(), due: (t) => t.due || "9999", who: (t) => person(t.who[0])?.name || "~" };
function renderList() {
  const rows = [...visible()].sort((a, b) => (RANK[sort.by](a) > RANK[sort.by](b) ? 1 : RANK[sort.by](a) < RANK[sort.by](b) ? -1 : 0) * sort.dir);
  const th = (by, label) => `<th data-sort="${by}">${label}${sort.by === by ? (sort.dir > 0 ? " ↑" : " ↓") : ""}</th>`;
  $("#view-list").innerHTML = `<div class="table-wrap"><table>
    <thead><tr>${th("title", "Task")}${th("col", "Status")}${th("prio", "Priority")}${th("due", "Due")}${th("who", "Assignees")}</tr></thead>
    <tbody>${rows.map((t) => `<tr data-id="${t.id}">
      <td><span style="color:var(--muted);font-size:12px">${t.key}</span> ${esc(t.title)}</td>
      <td><span class="dot" style="background:${column(t.col).color}"></span> <select data-inline="col" aria-label="Status">${state.columns.map((c) => `<option value="${c.id}"${c.id === t.col ? " selected" : ""}>${esc(c.title)}</option>`).join("")}</select></td>
      <td><select data-inline="prio" aria-label="Priority" class="prio prio-${t.prio}">${["high", "medium", "low"].map((p) => `<option value="${p}"${p === t.prio ? " selected" : ""}>${p}</option>`).join("")}</select></td>
      <td class="${late(t) ? "late" : ""}">${t.due ? fmt(t.due) : "—"}</td>
      <td>${t.who.length ? avatars(t.who) : "—"}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No tasks match.</td></tr>`}</tbody></table></div>`;
}
$("#view-list").addEventListener("click", (e) => {
  if (e.target.closest("select")) return;
  const th = e.target.closest("th");
  if (th) { sort = { by: th.dataset.sort, dir: sort.by === th.dataset.sort ? -sort.dir : 1 }; return renderList(); }
  const tr = e.target.closest("tr[data-id]");
  if (tr) openTask(+tr.dataset.id);
});
// Status and priority change in place, like the app's list.
$("#view-list").addEventListener("change", (e) => {
  const t = task(+e.target.closest("tr").dataset.id), k = e.target.dataset.inline;
  if (k === "col") changeColumn(t, e.target.value);
  else { log(t, `changed priority from ${cap(t.prio)} to ${cap(e.target.value)}`); t.prio = e.target.value; }
  save(); render();
});

// ── Calendar ──────────────────────────────────────────────────────────────
let month = new Date(); month.setDate(1);
function renderCalendar() {
  const start = new Date(month); start.setDate(1 - ((start.getDay() + 6) % 7)); // weeks start Monday
  const byDay = {};
  for (const t of visible()) if (t.due) (byDay[t.due] ||= []).push(t);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = iso(d);
    const cls = [d.getMonth() !== month.getMonth() && "other", key === day(0) && "today"].filter(Boolean).join(" ");
    cells.push(`<div class="${cls}" data-day="${key}"><span class="num">${d.getDate()}</span>${(byDay[key] || []).map((t) =>
      `<button class="chip prio-${t.prio}" data-id="${t.id}" draggable="true" title="${esc(t.title)}">${esc(t.title)}</button>`).join("")}</div>`);
  }
  $("#view-calendar").innerHTML = `<div class="cal-head">
      <h2>${month.toLocaleDateString("en", { month: "long", year: "numeric" })}</h2>
      <button class="btn ghost" data-step="-1" aria-label="Previous month">‹</button>
      <button class="btn ghost" data-step="0">Today</button>
      <button class="btn ghost" data-step="1" aria-label="Next month">›</button>
      <span class="muted hide-sm" style="font-size:12px;margin-left:auto">Drag a card to another day to change its due date.</span>
    </div>
    <div class="grid">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="dow">${d}</div>`).join("")}${cells.join("")}</div>`;
}
const cal = $("#view-calendar");
cal.addEventListener("click", (e) => {
  const step = e.target.closest("[data-step]");
  if (step) {
    if (step.dataset.step === "0") { month = new Date(); month.setDate(1); }
    else month.setMonth(month.getMonth() + +step.dataset.step);
    return renderCalendar();
  }
  const chip = e.target.closest(".chip");
  if (chip) openTask(+chip.dataset.id);
});
cal.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", e.target.dataset.id));
cal.addEventListener("dragover", (e) => { const c = e.target.closest("[data-day]"); if (c) { e.preventDefault(); c.classList.add("drop"); } });
cal.addEventListener("dragleave", (e) => e.target.closest("[data-day]")?.classList.remove("drop"));
cal.addEventListener("drop", (e) => {
  const c = e.target.closest("[data-day]"), t = task(+e.dataTransfer.getData("text/plain"));
  if (!c || !t) return;
  e.preventDefault();
  if (t.due !== c.dataset.day) { log(t, `changed the due date to ${fmt(c.dataset.day)}`); t.due = c.dataset.day; save(); }
  render();
});

// ── Timeline ──────────────────────────────────────────────────────────────
const dayNo = (s) => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / DAY);
const dayStr = (n) => new Date(n * DAY).toISOString().slice(0, 10);
function renderTimeline() {
  const DW = 28, ROW = 36, LEFT = 260;
  const dated = visible().filter((t) => t.start || t.due);
  const rows = dated.map((t) => {
    const a = dayNo(t.start || t.due), b = dayNo(t.due || t.start);
    return { t, start: Math.min(a, b), end: Math.max(a, b) };
  }).sort((x, y) => x.start - y.start || x.end - y.end);
  const el = $("#view-timeline");
  if (!rows.length) return void (el.innerHTML = `<p class="page muted">No dated cards yet. Give cards a start or due date to see them here.</p>`);
  const today = dayNo(day(0));
  const from = Math.min(today, ...rows.map((r) => r.start)) - 2, to = Math.max(today, ...rows.map((r) => r.end)) + 5;
  const days = Array.from({ length: to - from + 1 }, (_, i) => from + i);
  const x = (n) => (n - from) * DW;
  const rowOf = new Map(rows.map((r, i) => [r.t.id, i]));
  const arrows = rows.flatMap((r, i) => r.t.blockedBy.flatMap((b) => {
    const j = rowOf.get(b);
    if (j === undefined) return [];
    const x1 = x(rows[j].end + 1), y1 = j * ROW + ROW / 2, x2 = x(r.start), y2 = i * ROW + ROW / 2, isLate = r.start <= rows[j].end;
    const bend = Math.max(x1 + 6, Math.min(x2 - 6, x1 + 12));
    return [`<path d="M${x1} ${y1} H${bend} V${y2} H${x2}" fill="none" stroke="${isLate ? "#ef4444" : "var(--muted)"}" stroke-width="1.5" marker-end="url(#tl-${isLate ? "late" : "ok"})">${isLate ? `<title>Starts before ${rows[j].t.key} is done</title>` : ""}</path>`];
  }));
  const head = days.map((n, i) => {
    const d = new Date(n * DAY), we = d.getUTCDay() % 6 === 0;
    return `<div class="tl-day${we ? " we" : ""}${n === today ? " today" : ""}">${i === 0 || d.getUTCDate() === 1 ? `<span class="m">${d.toLocaleDateString("en", { month: "short", year: "numeric", timeZone: "UTC" })}</span>` : ""}<span class="d">${d.getUTCDate()}</span></div>`;
  }).join("");
  el.innerHTML = `<div style="position:relative;width:${LEFT + days.length * DW}px;min-height:100%">
    <div class="tl-head"><div class="tl-name">Timeline</div>${head}</div>
    <div class="tl-today" style="left:${LEFT + x(today) + DW / 2}px" title="Today"></div>
    ${rows.map(({ t, start, end }) => `<div class="tl-row">
      <button class="tl-name" data-id="${t.id}"><span class="muted" style="font-size:10px">${t.key}</span><span style="${isDone(t) ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(t.title)}</span></button>
      <button class="tl-bar" data-id="${t.id}" title="${esc(t.title)} · ${dayStr(start)} → ${dayStr(end)}" style="left:${LEFT + x(start) + 2}px;width:${(end - start + 1) * DW - 4}px;background:${column(t.col).color};${isDone(t) ? "opacity:.5" : ""}">${esc(t.title)}</button>
    </div>`).join("")}
    <svg style="position:absolute;top:44px;left:${LEFT}px;overflow:visible;pointer-events:none;z-index:7" width="${days.length * DW}" height="${rows.length * ROW}" aria-hidden="true">
      <defs><marker id="tl-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker>
      <marker id="tl-late" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ef4444"/></marker></defs>
      ${arrows.join("")}</svg>
    ${visible().length - rows.length ? `<p class="tl-note">${visible().length - rows.length} card(s) without dates are not on the timeline.</p>` : ""}
  </div>`;
}
$("#view-timeline").addEventListener("click", (e) => { const b = e.target.closest("[data-id]"); if (b) openTask(+b.dataset.id); });

// ── Analytics ─────────────────────────────────────────────────────────────
const bars = (items, max) => items.map(([label, n, color]) =>
  `<div class="bar-row"><span title="${esc(label)}">${esc(label)}</span><span class="meter"><i style="width:${max ? (n / max) * 100 : 0}%;background:${color}"></i></span><span class="muted">${n}</span></div>`).join("");
function renderAnalytics() {
  const tasks = state.tasks.filter((t) => !t.archived);
  const done = tasks.filter(isDone).length;
  const perCol = state.columns.map((c) => [c.title, tasks.filter((t) => t.col === c.id).length, c.color]);
  const perPrio = ["high", "medium", "low"].map((p) => [cap(p), tasks.filter((t) => t.prio === p).length, PRIO[p]]);
  const load = [...state.members.map((m) => [m.name, tasks.filter((t) => !isDone(t) && t.who.includes(m.id)).length, m.color]),
    ["Unassigned", tasks.filter((t) => !isDone(t) && !t.who.length).length, "var(--muted)"]];
  const days = Array.from({ length: 14 }, (_, i) => day(i - 13));
  const changes = days.map((d) => state.tasks.reduce((n, t) => n + t.history.filter((h) => iso(new Date(h.at)) === d).length, 0));
  const top = Math.max(1, ...changes);
  $("#view-analytics").innerHTML = `<div class="page">
    <div class="tiles">
      <div class="tile"><small>Total tasks</small><b>${tasks.length}</b></div>
      <div class="tile"><small>Completed</small><b>${done}</b><em>${tasks.length ? Math.round((done / tasks.length) * 100) : 0}%</em></div>
      <div class="tile"><small>Outstanding</small><b>${tasks.length - done}</b></div>
      <div class="tile"><small>Overdue</small><b style="color:${tasks.some(late) ? "#ef4444" : "inherit"}">${tasks.filter(late).length}</b></div>
    </div>
    <div class="panels">
      <div class="panel"><h3>Tasks per column</h3>${bars(perCol, Math.max(...perCol.map((x) => x[1])))}</div>
      <div class="panel"><h3>Priority</h3>${bars(perPrio, Math.max(...perPrio.map((x) => x[1])))}</div>
      <div class="panel"><h3>Workload per member</h3><p class="muted" style="font-size:12px;margin:-6px 0 6px">Open tasks.</p>${bars(load, Math.max(...load.map((x) => x[1])))}</div>
      <div class="panel"><h3>Last 14 days</h3><p class="muted" style="font-size:12px;margin:-6px 0 0">Task changes per day.</p>
        <div class="spark">${changes.map((n, i) => `<div title="${fmt(days[i])}: ${n}"><i style="height:${(n / top) * 85}%"></i><span>${i % 2 ? "&nbsp;" : new Date(days[i] + "T00:00").getDate()}</span></div>`).join("")}</div></div>
    </div></div>`;
}

// ── Chat ──────────────────────────────────────────────────────────────────
let channel = "general";
const chName = (ch) => ch === "general" ? "# general" : person(ch)?.name ?? ch;
const unreadIn = (ch) => state.messages.filter((m) => m.ch === ch && m.from !== ME && m.at > (state.seen[ch] || 0)).length;
const unreadChat = () => ["general", ...state.members.filter((m) => m.id !== ME).map((m) => m.id)].reduce((n, ch) => n + unreadIn(ch), 0);
function renderChat() {
  state.seen[channel] = Date.now(); save();
  const dms = state.members.filter((m) => m.id !== ME);
  const item = (ch, label, extra = "") => `<button class="row" data-ch="${ch}" style="${ch === channel ? "background:var(--secondary);font-weight:500" : ""}">${extra}<span class="grow">${esc(label)}</span>${unreadIn(ch) ? `<span class="badge strong">${unreadIn(ch)}</span>` : ""}</button>`;
  const msgs = state.messages.filter((m) => m.ch === channel).sort((a, b) => a.at - b.at);
  const other = channel !== "general" && person(channel);
  $("#view-chat").innerHTML = `
    <div class="chat-list">
      <div class="side-label">CHANNELS</div>${item("general", "# general")}
      <div class="side-label">DIRECT MESSAGES</div>${dms.map((m) => item(m.id, m.name, `<span class="presence ${m.presence ?? "offline"}"></span>`)).join("")}
    </div>
    <div class="chat-main">
      <div class="chat-head">${other ? `<span class="presence ${other.presence ?? "offline"}"></span>` : ""}${esc(chName(channel))}${other ? `<small class="muted" style="font-weight:400">${other.presence === "online" ? "Online" : other.presence === "away" ? "Away" : "Offline"}</small>` : ""}</div>
      <div class="chat-feed" id="chat-feed">${msgs.map((m) => `<div class="msg">${avatar(person(m.from), 30)}<div style="min-width:0"><b>${esc(person(m.from)?.name ?? "?")}</b><time>${ago(m.at)}</time><p>${highlight(m.text)}</p></div></div>`).join("") || `<p class="empty">No messages yet. Say hi.</p>`}</div>
      <div class="chat-compose"><ul class="mentions" id="chat-mentions" role="listbox" hidden></ul><textarea id="chat-input" placeholder="Message ${esc(chName(channel))}… Enter to send, Shift+Enter for a new line" aria-label="Message"></textarea><button class="btn" id="chat-send">Send</button></div>
