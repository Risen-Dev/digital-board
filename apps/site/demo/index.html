// ── Meetings ──────────────────────────────────────────────────────────────
// A repeating meeting's next start is its first occurrence that hasn't ended yet.
function occurrence(m) {
  let start = new Date(`${m.date}T${m.time}`);
  const step = { daily: 1, weekly: 7 }[m.repeat];
  if (step) while (start.getTime() + m.dur * 6e4 < Date.now()) start = new Date(start.getTime() + step * DAY);
  return { start, end: new Date(start.getTime() + m.dur * 6e4) };
}
function meetingState(m) {
  const { start, end } = occurrence(m), now = Date.now();
  if (now >= start && now < end) return { live: true, text: "Now" };
  if (end < now) return { past: true, text: "Ended" };
  const mins = Math.round((start - now) / 6e4);
  return { text: mins < 60 ? `in ${mins}m` : mins < 1440 ? `in ${Math.round(mins / 60)}h` : `in ${Math.round(mins / 1440)}d` };
}
function renderMeetings() {
  const list = [...state.meetings].sort((a, b) => occurrence(a).start - occurrence(b).start);
  const row = (m) => {
    const { start } = occurrence(m), s = meetingState(m);
    return `<div class="meet${s.past ? " past" : ""}">
      <div class="when">${start.toLocaleDateString("en", { month: "short" })}<b>${start.getDate()}</b>${start.toLocaleTimeString("en", { hour: "2-digit", minute: "2-digit" })}</div>
      <div class="grow"><b>${esc(m.title)}</b> <span class="state${s.live ? " live" : ""}">${s.text}</span>${m.repeat ? ` <span class="state">${svg("repeat", "width:10px;height:10px;vertical-align:-1px")} ${cap(m.repeat)}</span>` : ""}
        <p>${m.dur} min · ${avatars(m.who)} ${m.notes ? `· ${highlight(m.notes)}` : ""}</p></div>
      ${m.link && !s.past ? `<a class="btn${s.live ? "" : " ghost"}" href="${esc(m.link)}" target="_blank" rel="noopener">Join</a>` : ""}
      <button class="btn ghost sm" data-edit-meet="${m.id}">Edit</button>
    </div>`;
  };
  const up = list.filter((m) => !meetingState(m).past), past = list.filter((m) => meetingState(m).past);
  $("#view-meetings").innerHTML = `<div class="page center">
    <div class="panel-head"><h2>Meetings</h2><button class="btn" id="new-meet">${svg("plus")}New meeting</button></div>
    <p class="sub">Times are read in each person’s own time zone.</p>
    ${up.map(row).join("") || `<p class="empty">No meetings planned.</p>`}
    ${past.length ? `<h3 style="margin:20px 0 10px">Past</h3>${past.map(row).join("")}` : ""}
  </div>`;
}
function openMeeting(id) {
  const m = state.meetings.find((x) => x.id === id) ?? { title: "", date: day(1), time: "10:00", dur: 30, repeat: "", who: [ME], link: "", notes: "" };
  smallDialog(id ? "Edit meeting" : "New meeting", `
    <label>Title <input name="title" required maxlength="80" value="${esc(m.title)}" placeholder="Daily standup"></label>
    <div class="form-row"><label>Starts on <input name="date" type="date" required value="${m.date}"></label><label>Time <input name="time" type="time" required value="${m.time}"></label></div>
    <div class="form-row"><label>Duration (minutes) <input name="dur" type="number" min="5" max="480" step="5" value="${m.dur}"></label>
      <label>Repeat <select name="repeat"><option value="">Never</option><option value="daily"${m.repeat === "daily" ? " selected" : ""}>Daily</option><option value="weekly"${m.repeat === "weekly" ? " selected" : ""}>Weekly</option></select></label></div>
    <div><div style="font-size:12px;color:var(--muted);margin-bottom:4px">Attendees</div><div class="member-picks">${state.members.map((p) =>
      `<label class="check-line"><input type="checkbox" name="who" value="${p.id}"${m.who.includes(p.id) ? " checked" : ""}>${esc(p.name)}</label>`).join("")}</div></div>
    <label>Meeting link <input name="link" type="url" value="${esc(m.link)}" placeholder="https://"></label>
    <label>Notes <textarea name="notes" maxlength="1000" placeholder="Agenda, dial-in…" style="min-height:60px">${esc(m.notes)}</textarea></label>
    <label class="check-line"><input type="checkbox" name="remind" checked>Remind attendees when it starts</label>
    <div style="display:flex;gap:8px"><button class="btn">Save</button><button type="button" class="btn ghost" data-close-small>Cancel</button>${id ? `<button type="button" class="btn danger" data-del-meet style="margin-left:auto">Delete</button>` : ""}</div>`,
  (v) => {
    Object.assign(m, { title: v.title.trim(), date: v.date, time: v.time, dur: +v.dur || 30, repeat: v.repeat, who: v._all("who"), link: v.link.trim(), notes: v.notes.trim() });
    if (!id) state.meetings.push({ ...m, id: Date.now() });
    save(); render();
  },
  (e) => {
    if (!e.target.closest("[data-del-meet]")) return;

  });
}

// Dependencies: "waiting on" cards this one is blocked by, and the reverse.
function renderDeps() {
  const by = editing.blockedBy.map(task).filter(Boolean), blocking = state.tasks.filter((t) => t.blockedBy.includes(editing.id));
  const line = (t, rm) => `<div>${isDone(t) ? "✓" : svg("ban", "color:#ef4444")}<button type="button" class="key-link" data-open="${t.id}">${t.key}</button><span>${esc(t.title)}</span>${rm ? `<button type="button" class="x" data-undep="${t.id}" aria-label="Remove">×</button>` : ""}</div>`;
  $("#deps").innerHTML = (by.length ? `<small class="muted">Waiting on</small>${by.map((t) => line(t, true)).join("")}` : "")
    + (blocking.length ? `<small class="muted">Blocking</small>${blocking.map((t) => line(t, false)).join("")}` : "");
  $("#dep-options").innerHTML = state.tasks.filter((t) => t !== editing && !editing.blockedBy.includes(t.id) && !t.archived).map((t) => `<option value="${t.key} ${esc(t.title)}">`).join("");
}
$("#deps").addEventListener("click", (e) => {
  const b = e.target.closest("[data-undep]");
  if (!b) return;
  editing.blockedBy = editing.blockedBy.filter((id) => id !== +b.dataset.undep);
  save(); renderDeps(); render();
});
function addDep(input) {
  const q = input.value.trim().toLowerCase();
  const t = state.tasks.find((x) => x !== editing && !x.archived && (q.startsWith(x.key.toLowerCase() + " ") || q === x.key.toLowerCase() || x.title.toLowerCase() === q));
  if (!t) return;
  // A card can't wait on something that already waits on it.
  const waitsOn = (a, b, seen = new Set()) => a.blockedBy.some((id) => id === b.id || (!seen.has(id) && seen.add(id) && task(id) && waitsOn(task(id), b, seen)));
  if (waitsOn(t, editing)) return toast(`${t.key} already waits on ${editing.key}.`);
  editing.blockedBy.push(t.id);
  log(editing, `is now waiting on ${t.key}`);
  input.value = "";
  save(); renderDeps(); renderFeed(); render();
}
$("#dep-add").addEventListener("change", (e) => addDep(e.target));
$("#dep-add").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addDep(e.target); } });

// Time tracking: one running timer at a time, plus manual entries like "1h 30m".
function renderTimer() {
  const t = editing;
  $("#timer-row").innerHTML = `<button type="button" class="btn${t.time.since ? "" : " ghost"} sm" id="timer-toggle" title="Starting here stops your timer on any other card">${svg(t.time.since ? "stop" : "play")}${t.time.since ? "Stop timer" : "Start timer"}</button>
    <span>${svg("clock")} <span data-timer="${t.id}">${dur(tracked(t))}</span> logged</span>
    <input id="time-log" placeholder="Log time, e.g. 1h 30m" style="width:160px;padding:4px 8px"><button type="button" class="btn ghost sm" id="time-add">Log</button>`;
}
function stopTimer(t) {
  if (!t.time.since) return;
  const s = (Date.now() - t.time.since) / 1000;
  t.time = { secs: t.time.secs + s, since: null };
  log(t, `logged ${dur(s)}`);
}
$("#timer-row").addEventListener("click", (e) => {
  const t = editing;
  if (e.target.closest("#timer-toggle")) {
    if (t.time.since) stopTimer(t);
    else { state.tasks.forEach(stopTimer); t.time.since = Date.now(); log(t, "started the timer"); }
  } else if (e.target.closest("#time-add")) {
    const m = /^\s*(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*m)?\s*$/i.exec($("#time-log").value);
    const s = m && ((+m[1] || 0) * 3600 + (+m[2] || 0) * 60);
    if (!s) return toast("Write the time like 1h 30m, 45m or 2h.");
    t.time.secs += s;
    log(t, `logged ${dur(s)}`);
  } else return;
  save(); renderTimer(); renderFeed(); render();
});
setInterval(() => {

// Comments & activity: one muted line per event and the comments, oldest first.
const mentionNames = () => ["agent", ...state.members.map((p) => p.name)];
// Canvas tags are the names on groups of shapes (customData.tag); "@name" links to them.
function canvasTags() {
  let els = null;
  try { els = JSON.parse(localStorage.getItem(CANVAS_KEY)); } catch {}
  if (!els) return ["ReleaseFlow"]; // the seed's group, before the canvas was first opened
  return [...new Set(els.filter((e) => !e.isDeleted).map((e) => e.customData?.tag).filter(Boolean))];
}
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const highlight = (text) => {
  const tags = canvasTags();
  const words = [...mentionNames(), ...tags].sort((a, b) => b.length - a.length).map(reEsc);
  return keyLinks(esc(text).replace(new RegExp(`@(${words.join("|")})(?![\\w-])`, "g"), (_, w) =>
    tags.includes(w) ? `<button type="button" class="mention tag-link" data-tag="${w}">@${w}</button>` : `<span class="mention">@${w}</span>`));
};
const tagsIn = (text) => canvasTags().filter((tag) => new RegExp(`(^|\\s)@${tag}(?![\\w-])`).test(text));
function renderTagPreviews() {

  for (const tag of found) {

function renderFeed() {

// The demo has no model behind it: the "agent" summarises the card from its own fields.
function agentAnswer(t) {
  const open = t.checklist.filter((i) => !i.done).map((i) => i.text), names = t.who.map((id) => person(id)?.name).filter(Boolean);
  return `${t.key} is in ${column(t.col).title}, ${t.prio} priority, ${names.length ? `assigned to ${names.join(" and ")}` : "unassigned"}${t.due ? `, due ${fmt(t.due)}${late(t) ? " (overdue)" : ""}` : ""}.`
    + (blocked(t) ? ` It is waiting on ${t.blockedBy.map(task).filter((b) => b && !isDone(b)).map((b) => b.key).join(", ")}.` : "")
    + (t.checklist.length ? ` Checklist ${t.checklist.length - open.length}/${t.checklist.length}${open.length ? `, still open: ${open.join(", ")}` : ""}.` : "")

function postComment() {

// "@" at the caret opens the picker: the agent first (card comments only), then people, then canvas tags.
let closeMentions = () => {};
function attachMentions(input, list, submit, withAgent, modifier = false) {
  let mention = null, options = [], active = 0;
  const close = () => { mention = null; options = []; list.hidden = true; };
  if (input === comment) closeMentions = close;
  function draw() {
    const q = mention.query.toLowerCase();
    options = [...(withAgent ? [{ name: "agent", label: "AI agent" }] : []), ...state.members.map((p) => ({ name: p.name, label: p.name, p })), ...canvasTags().map((tag) => ({ name: tag, label: `@${tag}`, tag: true }))]
      .filter((o) => o.label.toLowerCase().includes(q) || o.name.toLowerCase().includes(q));
    active = Math.min(active, Math.max(options.length - 1, 0));
    list.hidden = !options.length;
    list.innerHTML = options.map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === active}">
      ${o.p ? avatar(o.p) : o.tag ? `<span class="agent-mark">${svg("tag")}</span>` : `<span class="agent-mark">${svg("spark")}</span>`}${esc(o.label)}${o.p ? "" : o.tag ? "<small>Canvas</small>" : "<small>Ask about this card</small>"}</li>`).join("");
  }
  function pick(o) {
    const caret = input.selectionStart, insert = `@${o.name} `;
    input.value = input.value.slice(0, mention.start) + insert + input.value.slice(caret);
    const at = mention.start + insert.length;
    close();
    input.focus();
    input.setSelectionRange(at, at);
  }
  input.addEventListener("input", () => {
    const m = /(^|\s)@([^\s@]*)$/.exec(input.value.slice(0, input.selectionStart));
    if (!m) return close();
    mention = { query: m[2], start: input.selectionStart - m[2].length - 1 };
    active = 0;
    draw();
  });
  input.addEventListener("keydown", (e) => {
    if (options.length) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : options.length - 1)) % options.length;
        return draw();
      }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); return pick(options[active]); }
      if (e.key === "Escape") { e.preventDefault(); return close(); }
    }
    if (e.key === "Enter" && (modifier ? e.metaKey || e.ctrlKey : !e.shiftKey)) { e.preventDefault(); submit(); }
  });
  input.addEventListener("blur", () => setTimeout(close, 150));
  list.addEventListener("mousedown", (e) => {
    const li = e.target.closest("li");
    if (!li) return;
    e.preventDefault();
    pick(options[+li.dataset.i]);
  });
}
attachMentions(comment, $("#mentions"), postComment, true, true);

// Click-to-rename, like the app's EditableTitle.
function editInPlace(el, value, onSave) {
  const input = document.createElement("input");
  input.value = value; input.maxLength = 60;
  input.style.cssText = "font:inherit;font-weight:600;padding:2px 6px;width:180px";
  el.replaceChildren(input);
  input.focus(); input.select();
  let done = false;
  const finish = (ok) => { if (done) return; done = true; if (ok && input.value.trim()) onSave(input.value.trim()); save(); render(); };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  input.addEventListener("blur", () => finish(true));
}

};

const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
// Palettes carry their own dark tokens under .is-dark, so the class follows the effective mode.
const syncDark = () => root.classList.toggle("is-dark", isDark());
function setTheme(mode) {
  if (mode) root.dataset.theme = mode; else delete root.dataset.theme;
  try { mode ? localStorage.setItem("theme", mode) : localStorage.removeItem("theme"); } catch {}
  syncDark();
  window.dispatchEvent(new Event("themechange"));
  if (section === "settings") renderSettings();
}
function setPalette(id) {
  if (id === "graphite") delete root.dataset.palette; else root.dataset.palette = id;
  try { localStorage.setItem("palette", id); } catch {}
  if (section === "settings") renderSettings();
}
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; const p = localStorage.getItem("palette"); if (p && p !== "graphite") root.dataset.palette = p; } catch {}
syncDark();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { syncDark(); window.dispatchEvent(new Event("themechange")); });
$("#theme").onclick = () => setTheme(isDark() ? "light" : "dark");

show();
</script>

<script type="module">
// Excalidraw (the same editor the app uses) is loaded only when the Canvas tab opens
// or a card shows a canvas preview.
window.EXCALIDRAW_ASSET_PATH = "https://unpkg.com/@excalidraw/excalidraw@0.18.1/dist/prod/";
let started = false, libPromise, api = null, pendingTag = null, feedHighlights = null;
const lib = () => (libPromise ||= Promise.all([
  import("react"),
  import("react-dom/client"),
  import("https://esm.sh/@excalidraw/excalidraw@0.18.1?external=react,react-dom"),
]));
const dark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
// The seed's flow is one group named ReleaseFlow; the caption above it stays out.
const sceneElements = (ex) => {
  let els = null;
  try { els = JSON.parse(localStorage.getItem(CANVAS_KEY)); } catch {}
  return els || ex.convertToExcalidrawElements(seed()).map((e) =>
    e.type === "text" && !e.containerId ? e : { ...e, groupIds: ["release-flow"], customData: { tag: "ReleaseFlow" } });
};

// A PNG of one named group, for the card's Canvas section.
window.tagPreview = async (tag) => {
  try {
    const [, , ex] = await lib();
    const elements = (api ? api.getSceneElements() : sceneElements(ex)).filter((e) => !e.isDeleted && e.customData?.tag === tag);
    if (!elements.length) return null;
    const png = await ex.exportToBlob({
      elements,
      appState: { exportBackground: false, exportScale: 2, exportWithDarkMode: dark() },
      files: null,
      exportPadding: 8,
      mimeType: "image/png",
    });
    return URL.createObjectURL(png);
  } catch { return null; }
};

function applyFocus() {
  if (!api || !pendingTag) return;
  const shapes = api.getSceneElements().filter((e) => e.customData?.tag === pendingTag);
  pendingTag = null;
  if (!shapes.length) return;
  const group = shapes[0].groupIds.at(-1);
  api.updateScene({ appState: { selectedElementIds: Object.fromEntries(shapes.map((e) => [e.id, true])), selectedGroupIds: group ? { [group]: true } : {} } });
  api.scrollToContent(shapes, { fitToContent: true, animate: true });
}
window.focusTag = (tag) => {
  pendingTag = tag;
  setTimeout(applyFocus, 50);
};

window.loadCanvas = async () => {
  if (started) return;
  started = true;
  const host = document.getElementById("view-canvas");
  try {
    const [{ createElement, useEffect, useState }, { createRoot }, ex] = await lib();
    const elements = sceneElements(ex);

    // Select shapes, click Tag, name them: they become one group with customData.tag.
    async function tagSelection() {
      if (!api) return;
      const ids = api.getAppState().selectedElementIds;
      const chosen = (e) => ids[e.id] || (e.containerId && ids[e.containerId]);
      const picked = api.getSceneElements().filter(chosen);
      if (!picked.length) return alert("Select the shapes to tag first.");
      const raw = prompt("Name the selected shapes. Cards can then mention them as @name. Leave blank to remove the name.", picked[0].customData?.tag ?? "");
      if (raw === null) return;
      const tag = raw.trim().replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "");
      const outer = picked[0].groupIds.at(-1);
      const group = outer && picked.every((e) => e.groupIds.at(-1) === outer) ? null : crypto.randomUUID();
      api.updateScene({
        elements: api.getSceneElementsIncludingDeleted().map((e) => !e.isDeleted && chosen(e)
          ? ex.newElementWith(e, { customData: { ...e.customData, tag: tag || undefined }, ...(tag && group ? { groupIds: [...e.groupIds, group] } : {}) })
          : e),
        captureUpdate: ex.CaptureUpdateAction.IMMEDIATELY,
      });
    }

    function Highlights() {
      const [boxes, setBoxes] = useState([]);
      useEffect(() => {
        let last = "";
        feedHighlights = (els, { scrollX, scrollY, zoom }) => {
          const bounds = new Map();
          for (const e of els) {
            const tag = e.customData?.tag;
            if (!tag || e.isDeleted) continue;
            const xs = e.points ? e.points.map(([x]) => e.x + x) : [e.x, e.x + e.width];
            const ys = e.points ? e.points.map(([, y]) => e.y + y) : [e.y, e.y + e.height];
            const b = bounds.get(tag) ?? [Infinity, Infinity, -Infinity, -Infinity];
            bounds.set(tag, [Math.min(b[0], ...xs), Math.min(b[1], ...ys), Math.max(b[2], ...xs), Math.max(b[3], ...ys)]);
          }
          const pad = 12;
          const next = [...bounds].map(([tag, [x1, y1, x2, y2]]) => ({
            tag, left: (x1 + scrollX) * zoom.value - pad, top: (y1 + scrollY) * zoom.value - pad,
            width: (x2 - x1) * zoom.value + pad * 2, height: (y2 - y1) * zoom.value + pad * 2,
          }));
          const key = JSON.stringify(next);
          if (key !== last) { last = key; setBoxes(next); }
        };
        return () => { feedHighlights = null; };
      }, []);
      return createElement("div", { className: "tag-layer" }, boxes.map((b) =>
        createElement("div", { key: b.tag, className: "tag-frame", style: { left: b.left, top: b.top, width: b.width, height: b.height } },
          createElement("span", null, `@${b.tag}`))));
    }

    let timer;
    function Canvas() {
      const [theme, setTheme] = useState(dark() ? "dark" : "light");
      useEffect(() => {
        const sync = () => setTheme(dark() ? "dark" : "light");
        window.addEventListener("themechange", sync);
        return () => window.removeEventListener("themechange", sync);
      }, []);
      return createElement("div", { style: { position: "absolute", inset: 0 } },
        createElement(ex.Excalidraw, {
          theme,
          initialData: { elements, scrollToContent: true },
          excalidrawAPI: (a) => { api = a; setTimeout(applyFocus, 300); },
          onChange: (els, appState) => {
            feedHighlights?.(els, appState);
            clearTimeout(timer);
            timer = setTimeout(() => { try { localStorage.setItem(CANVAS_KEY, JSON.stringify(els.filter((e) => !e.isDeleted))); } catch {} }, 400);
          },
        }),
        createElement(Highlights),
        createElement("button", { type: "button", className: "tag-btn", title: "Group and name the selected shapes", onClick: () => void tagSelection(),
          dangerouslySetInnerHTML: { __html: `${svg("tag")}Tag` } }));
    }
    host.innerHTML = "";
    createRoot(host).render(createElement(Canvas));
  } catch (error) {
    console.error(error);
    host.innerHTML = `<div class="loading">The canvas could not load (it needs esm.sh and unpkg.com). The board, list and calendar still work.</div>`;
  }
};

// A small release flow, like the one the Tech template seeds.
function seed() {
  const W = 170, H = 64, at = {};
  const box = (id, x, y, text, type = "rectangle", backgroundColor = "#e7f5ff") =>
    (at[id] = { x, y }, { id, type, x, y, width: W, height: H, backgroundColor, fillStyle: "solid", label: { text, fontFamily: 2 } });
  // convertToExcalidrawElements keeps the given points, so each arrow is placed by hand.
  const arrow = (from, to, points) => ({ type: "arrow", ...points, start: { id: from }, end: { id: to } });
  const down = (from, to) => arrow(from, to, { x: at[from].x + W / 2, y: at[from].y + H, points: [[0, 0], [0, at[to].y - at[from].y - H]] });
  return [
    box("a", 0, 0, "Branch WEB-42", "ellipse", "#d3f9d8"),
    box("b", 0, 130, "Open pull request"),
    box("c", 0, 260, "CI passes?", "diamond", "#fff3bf"),
    box("d", 0, 400, "Merge → Done", "ellipse", "#d3f9d8"),
    box("e", 280, 260, "Fix and push", "rectangle", "#ffe3e3"),
    down("a", "b"), down("b", "c"), down("c", "d"),
    arrow("c", "e", { x: W, y: 260 + H / 2, points: [[0, 0], [280 - W, 0]] }),
    arrow("e", "b", { x: 280 + W / 2, y: 260, points: [[0, 0], [0, -98], [-(280 + W / 2 - W), -98]] }),
    { type: "text", x: 0, y: -60, text: "Try it: drag, draw, add shapes", fontSize: 18, fontFamily: 2, strokeColor: "#868e96" },
  ];
}
</script>
