<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Demo — Digital Board</title>
<meta name="description" content="Try Digital Board in your browser: drag cards, edit tasks, switch views and draw on the canvas. No sign-up; everything stays in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2318181b'/%3E%3Crect x='3' y='3' width='4.5' height='4.5' rx='1' fill='%23fff'/%3E%3Crect x='8.5' y='3' width='4.5' height='4.5' rx='1' fill='%23fff' opacity='.6'/%3E%3Crect x='3' y='8.5' width='4.5' height='4.5' rx='1' fill='%23fff' opacity='.6'/%3E%3Crect x='8.5' y='8.5' width='4.5' height='4.5' rx='1' fill='%23fff' opacity='.3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.0",
    "react/": "https://esm.sh/react@19.2.0/",
    "react-dom": "https://esm.sh/react-dom@19.2.0",
    "react-dom/": "https://esm.sh/react-dom@19.2.0/"
  }
}
</script>
<style>
  /* Tokens and column palette from app/globals.css and lib/board.ts. */
  :root {
    --bg: oklch(1 0 0); --fg: oklch(0.141 0.005 285.823); --card: oklch(1 0 0);
    --primary: oklch(0.21 0.006 285.885); --primary-fg: oklch(0.985 0 0);
    --secondary: oklch(0.967 0.001 286.375); --muted: oklch(0.552 0.016 285.938);
    --border: oklch(0.92 0.004 286.32); --lane: oklch(0.985 0 0);
    --c0: #6366f1; --c1: #10b981; --c2: #f59e0b; --c3: #ec4899; --c4: #06b6d4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.141 0.005 285.823); --fg: oklch(0.985 0 0); --card: oklch(0.179 0.006 285.885);
      --primary: oklch(0.985 0 0); --primary-fg: oklch(0.21 0.006 285.885);
      --secondary: oklch(0.214 0.007 285.885); --muted: oklch(0.652 0.013 285.938);
      --border: oklch(0.274 0.006 286.033); --lane: oklch(0.16 0.005 285.823);
      --c1: #10a37f; --c2: #c2860a; --c4: #0e9bb8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.141 0.005 285.823); --fg: oklch(0.985 0 0); --card: oklch(0.179 0.006 285.885);
    --primary: oklch(0.985 0 0); --primary-fg: oklch(0.21 0.006 285.885);
    --secondary: oklch(0.214 0.007 285.885); --muted: oklch(0.652 0.013 285.938);
    --border: oklch(0.274 0.006 286.033); --lane: oklch(0.16 0.005 285.823);
    --c1: #10a37f; --c2: #c2860a; --c4: #0e9bb8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
         font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .banner { background: var(--primary); color: var(--primary-fg); font-size: 13px; text-align: center; padding: 6px 16px; }
  .banner a { font-weight: 600; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); display: grid; place-items: center; }
  .logo rect { fill: var(--primary-fg); }
  .project { color: var(--muted); }
  .tabs { display: flex; gap: 2px; background: var(--secondary); border-radius: 8px; padding: 3px; }
  .tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 13px; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .spacer { flex: 1; }
  .search { border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 5px 10px; width: 180px; font-size: 13px; }
  .btn { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-fg); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn.danger { background: transparent; color: #ef4444; border-color: var(--border); }
  .icon-btn { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--secondary); color: var(--fg); }
  main { flex: 1; min-height: 0; overflow: auto; }
  [hidden] { display: none !important; }

  /* Board */
  .board { display: flex; gap: 12px; padding: 16px; align-items: flex-start; min-height: 100%; }
  .lane { flex: 0 0 272px; background: var(--lane); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .lane.over { outline: 2px dashed var(--muted); outline-offset: -2px; }
  .lane-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; padding: 2px 4px 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .count { font-size: 11px; color: var(--muted); background: var(--secondary); border-radius: 999px; padding: 0 7px; font-weight: 500; }
  .cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: grab; text-align: left; width: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .card:hover { border-color: var(--muted); }
  .card.dragging { opacity: .4; }
  .card .key { font-size: 11px; color: var(--muted); }
  .card .title { font-weight: 500; margin: 2px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 6px; }
  .line > span { display: inline-flex; align-items: center; gap: 4px; }
  .muted { color: var(--muted); }
  .ico { width: 14px; height: 14px; flex: none; }
  .tag { border-radius: 999px; padding: 1px 8px; background: var(--secondary); color: var(--muted); font-size: 10px; font-weight: 500; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prio { border-radius: 4px; padding: 0 6px; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .02em; }
  .prio-high { color: #ef4444; background: rgba(239,68,68,.1); }
  .prio-medium { color: #f59e0b; background: rgba(245,158,11,.1); }
  .prio-low { color: #6b7280; background: rgba(107,114,128,.12); }
  .due { color: var(--muted); }
  .due.late { color: #ef4444; font-weight: 500; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .add { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 8px 4px 0; cursor: pointer; }
  .add:hover { color: var(--fg); }

  /* List */
  .list { padding: 16px; }
  table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--lane); cursor: pointer; user-select: none; }
  td:first-child { white-space: normal; min-width: 220px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--secondary); }
  .table-wrap { overflow-x: auto; }

  /* Calendar */
  .cal { padding: 16px; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cal-head h2 { font-size: 16px; margin: 0 8px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
  .grid > div { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 96px; padding: 4px; min-width: 0; }
  .grid .dow { min-height: 0; font-size: 11px; color: var(--muted); text-align: center; background: var(--lane); }
  .grid .num { font-size: 11px; color: var(--muted); }
  .grid .other { background: var(--lane); }
  .grid .today .num { background: var(--primary); color: var(--primary-fg); border-radius: 999px; padding: 0 6px; }
  .chip { display: block; width: 100%; border: 0; text-align: left; font-size: 11px; padding: 2px 6px; margin-top: 3px; border-radius: 4px; cursor: pointer;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Canvas */
  .canvas { height: 100%; min-height: 480px; position: relative; }
  .canvas .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

  /* Dialog */
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--fg); padding: 0; width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: hidden; }
  dialog.new { width: min(620px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, textarea { border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
  textarea { min-height: 90px; resize: vertical; }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 18px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .dlg-head .icon-btn { margin-left: auto; }
  .dlg-body { display: flex; height: min(640px, calc(100vh - 100px)); }
  dialog.new .dlg-body { height: auto; }
  .dlg-main { flex: 1; min-width: 0; overflow: auto; padding: 20px 28px; display: grid; gap: 16px; align-content: start; }
  .title-input { border: 0; background: transparent; font-size: 22px; font-weight: 600; padding: 0; min-height: 0; resize: none; field-sizing: content; }
  .title-input:focus { outline: none; }
  .props { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .prop { display: flex; align-items: center; gap: 10px; }
  .prop > span { width: 76px; flex: none; }
  .prop select, .prop input { flex: 1; min-width: 0; border-color: transparent; background: transparent; padding: 4px 8px; font-size: 13px; }
  .prop select:hover, .prop input:hover, .prop select:focus, .prop input:focus { background: var(--secondary); outline: none; }
  .section { border-top: 1px solid var(--border); padding-top: 14px; display: grid; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .section textarea { font-weight: 400; }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: var(--fg); }
  .checks input[type="checkbox"] { width: 14px; height: 14px; padding: 0; }
  .section input:not([type]) { font-size: 12px; font-weight: 400; }
  .actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; }
  .actions .danger { margin-left: auto; }
  .dlg-side { width: 340px; flex: none; border-left: 1px solid var(--border); background: var(--lane); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; }
  .feed { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .event { font-size: 11px; color: var(--muted); padding: 0 2px; }
  .comment { display: flex; gap: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .comment b { font-size: 12px; }
  .comment time { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .comment p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mention { color: var(--c0); font-weight: 600; }
  .agent-mark { width: 22px; height: 22px; border-radius: 50%; background: var(--secondary); color: var(--c0); display: grid; place-items: center; flex: none; }
  .composer { position: relative; border-top: 1px solid var(--border); padding: 10px; display: grid; gap: 6px; }
  .composer textarea { min-height: 56px; font-size: 13px; resize: none; }
  .composer .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .mentions { position: absolute; left: 10px; right: 10px; bottom: 100%; margin: 0 0 4px; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
  .mentions li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .mentions li[aria-selected="true"] { background: var(--secondary); }
  .mentions small { margin-left: auto; color: var(--muted); }
  @media (max-width: 760px) {
    .dlg-body { flex-direction: column; height: calc(100vh - 100px); overflow: auto; }
    .dlg-main { overflow: visible; padding: 16px; }
    .dlg-side { width: auto; border-left: 0; border-top: 1px solid var(--border); }
    .feed { max-height: 320px; }
    .props { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .search { order: 10; width: 100%; }
    .project, .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="banner">Live demo · changes stay in your browser · <a href="../">Back to Digital Board</a></div>
<header>
  <a class="brand" href="../">
    <span class="logo"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.2"/><rect x="9" y="1" width="6" height="6" rx="1.2" opacity=".6"/><rect x="1" y="9" width="6" height="6" rx="1.2" opacity=".6"/><rect x="9" y="9" width="6" height="6" rx="1.2" opacity=".3"/></svg></span>
    <span class="hide-sm">Digital Board</span>
  </a>
  <span class="project">/ Web App</span>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="board" aria-selected="true">Board</button>
    <button role="tab" data-view="list">List</button>
    <button role="tab" data-view="calendar">Calendar</button>
    <button role="tab" data-view="canvas">Canvas</button>
  </div>
  <span class="spacer"></span>
  <input class="search" id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks">
  <button class="btn ghost" id="reset" title="Put the sample data back">Reset demo</button>
  <button class="icon-btn" id="theme" aria-label="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <button class="btn" id="new">+ New task</button>
</header>

<main>
  <section id="view-board" class="board"></section>
  <section id="view-list" class="list" hidden></section>
  <section id="view-calendar" class="cal" hidden></section>
  <section id="view-canvas" class="canvas" hidden><div class="loading">Loading canvas…</div></section>
</main>

<dialog id="dialog">
  <div class="dlg-head"><span class="dot" id="dialog-dot"></span><span id="dialog-title">New task</span>
    <button type="button" class="icon-btn" id="close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="dlg-body">
    <form method="dialog" id="form" class="dlg-main">
      <textarea name="title" class="title-input" rows="1" required maxlength="120" placeholder="Task name" aria-label="Title"></textarea>
      <div class="props">
        <label class="prop"><span>Status</span><select name="col"></select></label>
        <label class="prop"><span>Priority</span><select name="prio"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
        <label class="prop"><span>Assignee</span><select name="who"></select></label>
        <label class="prop"><span>Due date</span><input name="due" type="date"></label>
        <label class="prop"><span>Labels</span><input name="label" maxlength="60" placeholder="Bug, Frontend" autocomplete="off"></label>
      </div>
      <label class="section">Description <textarea name="desc" maxlength="2000" placeholder="Add a description"></textarea></label>
      <div class="section" id="checklist-box">
        <span>Checklist <span id="check-count"></span></span>
        <div class="checks" id="checks"></div>
        <input id="check-add" placeholder="Add an item and press Enter" autocomplete="off">
      </div>
      <div class="actions">
        <button class="btn" value="save">Save</button>
        <button type="button" class="btn ghost" id="cancel">Cancel</button>
        <button type="button" class="btn danger" id="delete">Delete</button>
      </div>
    </form>
    <aside class="dlg-side" id="side">
      <div class="side-head">Comments &amp; activity</div>
      <div class="feed" id="feed"></div>
      <div class="composer">
        <ul class="mentions" id="mentions" role="listbox" hidden></ul>
        <textarea id="comment" placeholder="Write a comment. Type @ to mention someone, @agent to ask the AI." aria-label="Comment"></textarea>
        <div class="bar"><button type="button" class="btn" id="send">Comment</button><span id="comment-hint">Ctrl/⌘ + Enter</span></div>
      </div>
    </aside>
  </div>
</dialog>

<script>
const COLUMNS = [
  { id: "backlog", title: "Backlog", color: "var(--c0)" },
  { id: "todo", title: "Todo", color: "var(--c4)" },
  { id: "progress", title: "In Progress", color: "var(--c1)" },
  { id: "review", title: "In Review", color: "var(--c3)" },
  { id: "done", title: "Done", color: "var(--c2)" },
];
const PEOPLE = [
  { id: "ada", name: "Ada Lovelace", color: "#6366f1" },
  { id: "ben", name: "Ben Ito", color: "#10b981" },
  { id: "cleo", name: "Cleo Park", color: "#ec4899" },
];
const KEY = "digital-board-demo-v2";

// Due dates are relative to today, so the calendar always has something on it.
function day(offset) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return iso(d);
}
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function sample() {
  const t = (n, col, title, desc, prio, label, who, due, checklist = [], comments = []) =>
    ({ id: n, key: `WEB-${n}`, col, title, desc, prio, label, who, due, checklist, comments, history: [`Created by ${PEOPLE[0].name}`] });
  const c = (who, text, agent = false) => ({ who, text, agent, at: "Yesterday" });
  return {
    seq: 9,
    tasks: [
      t(1, "progress", "Set up CI pipeline (lint, test, build)", "Run on every pull request. Block merge when it fails.", "high", "Chore, DevOps", "ben", day(2),
        [{ text: "Lint", done: true }, { text: "Unit tests", done: true }, { text: "Build", done: false }]),
      t(2, "review", "Login page", "Acceptance criteria:\n- Email + password\n- Error on wrong password", "medium", "Feature, Frontend, Auth", "ada", day(5),
        [{ text: "Form", done: true }, { text: "Error state", done: false }], [c("cleo", "Looks good on mobile too.")]),
      t(3, "review", "Fix: session expires too early", "Steps to reproduce:\n1. Log in\n2. Wait 10 minutes", "high", "Bug, Auth", "ben", day(-1), [],
        [c("ada", "@agent what's left on this?"), c("", "WEB-3 is in In Review, high priority, assigned to Ben Ito and already overdue. The fix is written; it needs a review and a check that sessions now last the configured time.", true)]),
      t(4, "backlog", "Write README setup section", "", "low", "Docs", "", ""),
      t(5, "todo", "Dark mode for the settings page", "Follow the app theme toggle.", "medium", "Feature", "cleo", day(9)),
      t(6, "todo", "Add rate limit to the inbound webhook", "", "high", "Security", "ada", day(4)),
      t(7, "backlog", "Export board as CSV", "One row per task with its column.", "low", "Feature", "", day(14)),
      t(8, "done", "Project templates", "Six templates with their own columns.", "medium", "Feature", "cleo", day(-6), [{ text: "Six templates", done: true }]),
      t(9, "done", "Invite members by email", "", "low", "Feature", "ada", day(-3)),
    ],
  };
}

let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { state = sample(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const person = (id) => PEOPLE.find((p) => p.id === id);
const column = (id) => COLUMNS.find((c) => c.id === id);
const initials = (name) => name.split(" ").map((w) => w[0]).join("");
const fmt = (d) => new Date(d + "T00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
let query = "";
const visible = () => state.tasks.filter((t) => !query || `${t.key} ${t.title} ${t.desc} ${t.label}`.toLowerCase().includes(query));

const ICON = {
  desc: '<path d="M15 12H3M17 18H3M21 6H3"/>',
  check: '<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
  comment: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  cal: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
  tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>',
  spark: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
};
const svg = (k, style = "") => `<svg class="ico" style="${style}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const PRIO = { high: "#ef4444", medium: "#f59e0b", low: "#6b7280" };
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const labelsOf = (s) => (s || "").split(",").map((l) => l.trim()).filter(Boolean);
const avatar = (p) => `<span class="avatar" style="background:${p.color}" title="${esc(p.name)}">${initials(p.name)}</span>`;
const late = (t) => t.due && t.col !== "done" && t.due < day(0);

function card(t) {
  const p = person(t.who), labels = labelsOf(t.label);
  const icons = [
    t.desc && svg("desc"),
    t.checklist.length && `<span>${svg("check")}${t.checklist.filter((i) => i.done).length}/${t.checklist.length}</span>`,
    t.comments.length && `<span>${svg("comment")}${t.comments.length}</span>`,
  ].filter(Boolean);
  return `<button class="card" data-id="${t.id}">
    <div class="key">${t.key}</div><div class="title">${esc(t.title)}</div>
    ${icons.length ? `<div class="line muted">${icons.join("")}</div>` : ""}
    ${p || t.due ? `<div class="line">${p ? avatar(p) : ""}${t.due ? `<span class="due${late(t) ? " late" : ""}">${svg("cal")}${fmt(t.due)}</span>` : ""}</div>` : ""}
    <div class="line"><span>${svg("flag", `color:${PRIO[t.prio]};fill:${PRIO[t.prio]}`)}${cap(t.prio)}</span></div>
    ${labels.length ? `<div class="line">${svg("tag", "color:var(--muted)")}${labels.slice(0, 2).map((l) => `<span class="tag">${esc(l)}</span>`).join("")}${labels.length > 2 ? `<span class="muted" style="font-size:11px" title="${esc(labels.slice(2).join(", "))}">+${labels.length - 2}</span>` : ""}</div>` : ""}
  </button>`;
}

// ── Board ─────────────────────────────────────────────────────────────────
function renderBoard() {
  const tasks = visible();
  $("#view-board").innerHTML = COLUMNS.map((c) => {
    const mine = tasks.filter((t) => t.col === c.id);
    return `<div class="lane" data-col="${c.id}">
      <div class="lane-head"><span class="dot" style="background:${c.color}"></span>${c.title}<span class="count">${mine.length}</span></div>
      <div class="cards">${mine.map(card).join("")}</div>
      <button class="add" data-add="${c.id}">+ Add task</button>
    </div>`;
  }).join("");
}

const board = $("#view-board");
let drag = null; // { card, id, x, y, ghost, armed, timer, moved }
board.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) return drag?.moved ? null : openTask(+card.dataset.id);
  const add = e.target.closest("[data-add]");
  if (add) openTask(null, add.dataset.add);
});

// Pointer events instead of HTML5 drag and drop, which phones don't support.
// Mouse drags at once; touch needs a short hold so a swipe still scrolls the board.
board.addEventListener("pointerdown", (e) => {
  const card = e.target.closest(".card");
  if (!card || e.button > 0) return;
  drag = { card, id: +card.dataset.id, x: e.clientX, y: e.clientY, armed: e.pointerType === "mouse", moved: false };
  if (!drag.armed) drag.timer = setTimeout(() => { if (drag) { drag.armed = true; navigator.vibrate?.(10); } }, 250);
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  const far = Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6;
  if (!drag.armed) { if (far) { clearTimeout(drag.timer); drag = null; } return; }
  if (!drag.ghost) {
    if (!far) return;
    const r = drag.card.getBoundingClientRect();
    drag.ghost = drag.card.cloneNode(true);
    Object.assign(drag.ghost.style, { position: "fixed", left: 0, top: 0, width: `${r.width}px`, pointerEvents: "none",
      zIndex: 50, rotate: "2deg", boxShadow: "0 12px 32px rgb(0 0 0 / .25)" });
    drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
    document.body.append(drag.ghost);
    drag.card.classList.add("dragging");
    drag.moved = true;
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px)`;
  const lane = document.elementFromPoint(e.clientX, e.clientY)?.closest(".lane");
  board.querySelectorAll(".over").forEach((l) => l !== lane && l.classList.remove("over"));
  lane?.classList.add("over");
});
// While a touch drag is armed, stop the browser from scrolling instead.
addEventListener("touchmove", (e) => { if (drag?.armed) e.preventDefault(); }, { passive: false });
addEventListener("pointerup", (e) => {
  if (!drag) return;
  clearTimeout(drag.timer);
  const { id, ghost } = drag;
  if (!ghost) return void (drag = null);
  ghost.remove();
  const lane = document.elementFromPoint(e.clientX, e.clientY)?.closest(".lane");
  if (lane) {
    // Drop before the first card whose middle is below the pointer.
    const before = [...lane.querySelectorAll(".card:not(.dragging)")]
      .find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
    moveTask(id, lane.dataset.col, before ? +before.dataset.id : null);
  }
  renderBoard();
  setTimeout(() => (drag = null)); // after the click that follows pointerup
});
addEventListener("pointercancel", () => { if (drag) { clearTimeout(drag.timer); drag.ghost?.remove(); drag = null; renderBoard(); } });

function moveTask(id, col, beforeId) {
  const task = state.tasks.find((t) => t.id === id);
  const from = task.col;
  state.tasks.splice(state.tasks.indexOf(task), 1);
  task.col = col;
  const at = beforeId ? state.tasks.findIndex((t) => t.id === beforeId) : state.tasks.length;
  state.tasks.splice(at, 0, task);
  if (from !== col) task.history.push(`Moved from ${column(from).title} to ${column(col).title}`);
  save();
}

// ── List ──────────────────────────────────────────────────────────────────
let sort = { by: "col", dir: 1 };
const RANK = { col: (t) => COLUMNS.findIndex((c) => c.id === t.col), prio: (t) => ["high", "medium", "low"].indexOf(t.prio),
  title: (t) => t.title.toLowerCase(), due: (t) => t.due || "9999", who: (t) => person(t.who)?.name || "~" };
function renderList() {
  const rows = [...visible()].sort((a, b) => (RANK[sort.by](a) > RANK[sort.by](b) ? 1 : RANK[sort.by](a) < RANK[sort.by](b) ? -1 : 0) * sort.dir);
  const th = (by, label) => `<th data-sort="${by}">${label}${sort.by === by ? (sort.dir > 0 ? " ↑" : " ↓") : ""}</th>`;
  $("#view-list").innerHTML = `<div class="table-wrap"><table>
    <thead><tr>${th("title", "Task")}${th("col", "Status")}${th("prio", "Priority")}${th("due", "Due")}${th("who", "Assignee")}</tr></thead>
    <tbody>${rows.map((t) => `<tr data-id="${t.id}">
      <td><span class="key" style="color:var(--muted);font-size:12px">${t.key}</span> ${esc(t.title)}</td>
      <td><span class="dot" style="display:inline-block;background:${column(t.col).color}"></span> ${column(t.col).title}</td>
      <td><span class="prio prio-${t.prio}">${t.prio}</span></td>
      <td>${t.due ? fmt(t.due) : "—"}</td>
      <td>${person(t.who)?.name || "—"}</td></tr>`).join("")}</tbody></table></div>`;
}
$("#view-list").addEventListener("click", (e) => {
  const th = e.target.closest("th");
  if (th) { sort = { by: th.dataset.sort, dir: sort.by === th.dataset.sort ? -sort.dir : 1 }; return renderList(); }
  const tr = e.target.closest("tr[data-id]");
  if (tr) openTask(+tr.dataset.id);
});

// ── Calendar ──────────────────────────────────────────────────────────────
let month = new Date(); month.setDate(1);
function renderCalendar() {
  const start = new Date(month); start.setDate(1 - ((start.getDay() + 6) % 7)); // weeks start Monday
  const byDay = {};
  for (const t of visible()) if (t.due) (byDay[t.due] ||= []).push(t);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = iso(d);
    const cls = [d.getMonth() !== month.getMonth() && "other", key === day(0) && "today"].filter(Boolean).join(" ");
    cells.push(`<div class="${cls}"><span class="num">${d.getDate()}</span>${(byDay[key] || []).map((t) =>
      `<button class="chip prio-${t.prio}" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>`).join("")}</div>`);
  }
  $("#view-calendar").innerHTML = `<div class="cal-head">
      <h2>${month.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</h2>
      <button class="btn ghost" data-step="-1" aria-label="Previous month">‹</button>
      <button class="btn ghost" data-step="0">Today</button>
      <button class="btn ghost" data-step="1" aria-label="Next month">›</button>
    </div>
    <div class="grid">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="dow">${d}</div>`).join("")}${cells.join("")}</div>`;
}
$("#view-calendar").addEventListener("click", (e) => {
  const step = e.target.closest("[data-step]");
  if (step) {
    if (step.dataset.step === "0") { month = new Date(); month.setDate(1); }
    else month.setMonth(month.getMonth() + +step.dataset.step);
    return renderCalendar();
  }
  const chip = e.target.closest(".chip");
  if (chip) openTask(+chip.dataset.id);
});

// ── Task dialog ───────────────────────────────────────────────────────────
const dialog = $("#dialog"), form = $("#form");
form.col.innerHTML = COLUMNS.map((c) => `<option value="${c.id}">${c.title}</option>`).join("");
form.who.innerHTML = `<option value="">Unassigned</option>` + PEOPLE.map((p) => `<option value="${p.id}">${p.name}</option>`).join("");
let editing = null;
function openTask(id, col = "todo") {
  const t = state.tasks.find((t) => t.id === id);
  editing = t || null;
  dialog.classList.toggle("new", !t);
  $("#dialog-title").textContent = t ? `${column(t.col).title} / ${t.key}` : "New task";
  $("#dialog-dot").style.background = t ? column(t.col).color : "transparent";
  form.title.value = t?.title ?? "";
  form.desc.value = t?.desc ?? "";
  form.col.value = t?.col ?? col;
  form.prio.value = t?.prio ?? "medium";
  form.who.value = t?.who ?? "";
  form.due.value = t?.due ?? "";
  form.label.value = t?.label ?? "";
  $("#delete").hidden = !t;
  $("#side").hidden = !t;
  $("#checklist-box").hidden = !t;
  $("#comment").value = "";
  closeMentions();
  if (t) { renderChecks(); renderFeed(); }
  dialog.showModal();
  if (!t) form.title.focus();
}
form.title.addEventListener("keydown", (e) => { if (e.key === "Enter") e.preventDefault(); });
form.addEventListener("submit", () => {
  const v = Object.fromEntries(new FormData(form));
  if (!editing) {
    const id = ++state.seq;
    state.tasks.push({ id, key: `WEB-${id}`, ...v, title: v.title.trim(), checklist: [], comments: [], history: ["Created by you"] });
  } else {
    const changed = ["title", "desc", "col", "prio", "who", "due", "label"].filter((k) => editing[k] !== v[k]);
    if (editing.col !== v.col) editing.history.push(`Moved from ${column(editing.col).title} to ${column(v.col).title}`);
    const other = changed.filter((k) => k !== "col");
    if (other.length) editing.history.push(`Edited ${other.map((k) => ({ desc: "description", prio: "priority", who: "assignee", due: "due date", label: "labels" })[k] || k).join(", ")}`);
    Object.assign(editing, v, { title: v.title.trim() });
  }
  save(); render();
});
$("#cancel").onclick = $("#close").onclick = () => dialog.close();
$("#delete").onclick = () => {
  state.tasks = state.tasks.filter((t) => t !== editing);
  save(); dialog.close(); render();
};

// Checklist: ticks and new items save at once, like the app.
function renderChecks() {
  const items = editing.checklist;
  $("#check-count").textContent = items.length ? `${items.filter((i) => i.done).length}/${items.length}` : "";
  $("#checks").innerHTML = items.map((i, n) => `<label><input type="checkbox" data-n="${n}"${i.done ? " checked" : ""}>${esc(i.text)}</label>`).join("");
}
$("#checks").addEventListener("change", (e) => {
  const item = editing.checklist[+e.target.dataset.n];
  item.done = e.target.checked;
  save(); renderChecks(); render();
});
$("#check-add").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const text = e.target.value.trim();
  if (!text) return;
  editing.checklist.push({ text, done: false });
  e.target.value = "";
  save(); renderChecks(); render();
});

// Comments & activity: events as one muted line each, then comments, oldest first.
const MENTION_NAMES = ["agent", ...PEOPLE.map((p) => p.name)];
const highlight = (text) => esc(text).replace(new RegExp(`@(${MENTION_NAMES.join("|")})`, "g"), '<span class="mention">@$1</span>');
function renderFeed() {
  const feed = $("#feed");
  feed.innerHTML = editing.history.map((h) => `<div class="event">${esc(h)}</div>`).join("") + editing.comments.map((c) => {
    const p = person(c.who);
    const mark = c.agent ? `<span class="agent-mark">${svg("spark")}</span>` : p ? avatar(p) : `<span class="avatar" style="background:#71717a">Y</span>`;
    return `<div class="comment">${mark}<div style="min-width:0"><b>${c.agent ? "AI agent" : p?.name ?? "You"}</b><time>${esc(c.at)}</time><p>${highlight(c.text)}</p></div></div>`;
  }).join("");
  feed.scrollTop = feed.scrollHeight;
}

// The demo has no model behind it: the "agent" summarises the card from its own fields.
function agentAnswer(t) {
  const p = person(t.who), open = t.checklist.filter((i) => !i.done).map((i) => i.text);
  return `${t.key} is in ${column(t.col).title}, ${t.prio} priority, ${p ? `assigned to ${p.name}` : "unassigned"}${t.due ? `, due ${fmt(t.due)}${late(t) ? " (overdue)" : ""}` : ""}.`
    + (t.checklist.length ? ` Checklist ${t.checklist.length - open.length}/${t.checklist.length}${open.length ? `, still open: ${open.join(", ")}` : ""}.` : "")
    + "\n\n(Demo answer. In the app the AI agent reads this card, the board, meetings and canvas sheets, and answers your actual question.)";
}
const comment = $("#comment");
function postComment() {
  const text = comment.value.trim();
  if (!text) return;
  const task = editing;
  task.comments.push({ who: "", text, agent: false, at: "Just now" });
  comment.value = "";
  closeMentions();
  save(); renderFeed(); render();
  if (!/(^|\s)@agent\b/i.test(text)) return;
  $("#comment-hint").textContent = "AI agent is thinking…";
  setTimeout(() => {
    task.comments.push({ who: "", text: agentAnswer(task), agent: true, at: "Just now" });
    $("#comment-hint").textContent = "Ctrl/⌘ + Enter";
    save(); render();
    if (editing === task) renderFeed();
  }, 900);
}
$("#send").onclick = postComment;

// "@" at the caret opens the picker: the agent first, then the people on the project.
let mention = null, options = [], active = 0;
function closeMentions() { mention = null; options = []; $("#mentions").hidden = true; }
function renderMentions() {
  const q = mention.query.toLowerCase();
  options = [{ name: "agent", label: "AI agent" }, ...PEOPLE.map((p) => ({ name: p.name, label: p.name, p }))]
    .filter((o) => o.label.toLowerCase().includes(q) || o.name.toLowerCase().includes(q));
  active = Math.min(active, Math.max(options.length - 1, 0));
  $("#mentions").hidden = !options.length;
  $("#mentions").innerHTML = options.map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === active}">
    ${o.p ? avatar(o.p) : `<span class="agent-mark">${svg("spark")}</span>`}${esc(o.label)}${o.p ? "" : "<small>Ask about this card</small>"}</li>`).join("");
}
function pick(o) {
  const caret = comment.selectionStart, insert = `@${o.name} `;
  comment.value = comment.value.slice(0, mention.start) + insert + comment.value.slice(caret);
  const at = mention.start + insert.length;
  closeMentions();
  comment.focus();
  comment.setSelectionRange(at, at);
}
comment.addEventListener("input", () => {
  const m = /(^|\s)@([^\s@]*)$/.exec(comment.value.slice(0, comment.selectionStart));
  if (!m) return closeMentions();
  mention = { query: m[2], start: comment.selectionStart - m[2].length - 1 };
  active = 0;
  renderMentions();
});
comment.addEventListener("keydown", (e) => {
  if (options.length) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : options.length - 1)) % options.length;
      return renderMentions();
    }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); return pick(options[active]); }
    if (e.key === "Escape") { e.preventDefault(); return closeMentions(); }
  }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) postComment();
});
comment.addEventListener("blur", () => setTimeout(closeMentions, 150));
$("#mentions").addEventListener("mousedown", (e) => {
  const li = e.target.closest("li");
  if (!li) return;
  e.preventDefault();
  pick(options[+li.dataset.i]);
});

// ── Shell ─────────────────────────────────────────────────────────────────
let view = "board";
function render() {
  ({ board: renderBoard, list: renderList, calendar: renderCalendar, canvas: () => {} })[view]();
}
document.querySelector(".tabs").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-view]");
  if (!tab) return;
  view = tab.dataset.view;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b === tab));
  document.querySelectorAll("main > section").forEach((s) => (s.hidden = s.id !== `view-${view}`));
  $("#search").hidden = view === "canvas";
  if (view === "canvas") window.loadCanvas?.();
  render();
});
$("#search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });
$("#new").onclick = () => openTask(null);
$("#reset").onclick = () => {
  state = sample(); save();
  try { localStorage.removeItem(KEY + "-canvas"); } catch {}
  location.reload();
};

const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
$("#theme").onclick = () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  window.dispatchEvent(new Event("themechange"));
};
render();
</script>

<script type="module">
// Excalidraw (the same editor the app uses) is loaded only when the Canvas tab opens.
window.EXCALIDRAW_ASSET_PATH = "https://unpkg.com/@excalidraw/excalidraw@0.18.1/dist/prod/";
const CANVAS_KEY = "digital-board-demo-v1-canvas";
let started = false;

window.loadCanvas = async () => {
  if (started) return;
  started = true;
  const host = document.getElementById("view-canvas");
  try {
    const [{ createElement, useEffect, useState }, { createRoot }, ex] = await Promise.all([
      import("react"),
      import("react-dom/client"),
      import("https://esm.sh/@excalidraw/excalidraw@0.18.1?external=react,react-dom"),
    ]);

    let elements;
    try { elements = JSON.parse(localStorage.getItem(CANVAS_KEY)); } catch {}
    elements ||= ex.convertToExcalidrawElements(seed());

    const dark = () => {
      const t = document.documentElement.dataset.theme;
      return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    };
    let timer;
    function Canvas() {
      const [theme, setTheme] = useState(dark() ? "dark" : "light");
      useEffect(() => {
        const sync = () => setTheme(dark() ? "dark" : "light");
        window.addEventListener("themechange", sync);
        return () => window.removeEventListener("themechange", sync);
      }, []);
      return createElement(ex.Excalidraw, {
        theme,
        initialData: { elements, scrollToContent: true },
        onChange: (els) => {
          clearTimeout(timer);
          timer = setTimeout(() => { try { localStorage.setItem(CANVAS_KEY, JSON.stringify(els.filter((e) => !e.isDeleted))); } catch {} }, 400);
        },
      });
    }
    host.innerHTML = "";
    createRoot(host).render(createElement(Canvas));
  } catch (error) {
    console.error(error);
    host.innerHTML = `<div class="loading">The canvas could not load (it needs esm.sh and unpkg.com). The board, list and calendar still work.</div>`;
  }
};

// A small release flow, like the one the Tech template seeds.
function seed() {
  const W = 170, H = 64, at = {};
  const box = (id, x, y, text, type = "rectangle", backgroundColor = "#e7f5ff") =>
    (at[id] = { x, y }, { id, type, x, y, width: W, height: H, backgroundColor, fillStyle: "solid", label: { text, fontFamily: 2 } });
  // convertToExcalidrawElements keeps the given points, so each arrow is placed by hand.
  const arrow = (from, to, points) => ({ type: "arrow", ...points, start: { id: from }, end: { id: to } });
  const down = (from, to) => arrow(from, to, { x: at[from].x + W / 2, y: at[from].y + H, points: [[0, 0], [0, at[to].y - at[from].y - H]] });
  return [
    box("a", 0, 0, "Branch WEB-42", "ellipse", "#d3f9d8"),
    box("b", 0, 130, "Open pull request"),
    box("c", 0, 260, "CI passes?", "diamond", "#fff3bf"),
    box("d", 0, 400, "Merge → Done", "ellipse", "#d3f9d8"),
